<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b55"><title>Books & Notes | EXAM JUNCTION</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17243a;font-family:Arial,sans-serif;padding-bottom:78px}.app{max-width:760px;margin:auto;min-height:100vh}header{padding:17px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;justify-content:space-between;align-items:center}.brand{color:#173b73;font-weight:900;text-decoration:none}main{padding:20px 16px}h1,h2,h3{color:#10274c}.muted{color:#718096;font-size:13px;line-height:1.6}.search{width:100%;padding:14px;border:1px solid #dfe6f0;border-radius:12px;margin:16px 0}.list{display:grid;gap:12px}.book{background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px}.badge{display:inline-block;padding:5px 8px;border-radius:7px;background:#eaf8f0;color:#176b43;font-size:11px;font-weight:bold}.restricted{background:#fff3dd;color:#875b0a}.btn{display:inline-block;margin-top:10px;background:#173b73;color:white;padding:11px 14px;border-radius:10px;text-decoration:none;border:0;font-weight:bold}.notice{padding:20px;text-align:center;background:white;border:1px dashed #cbd6e5;border-radius:14px;color:#718096}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:white;border-top:1px solid #e6ebf2}nav a{text-align:center;color:#68768b;text-decoration:none;font-size:11px;padding:6px}nav .active{color:#173b73;font-weight:bold}.viewer{width:100%;height:70vh;border:0;margin-top:12px;border-radius:10px}.reader-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.reader-actions button{border:0;border-radius:10px;padding:11px 14px;background:#173b73;color:white;font-weight:700}.reader-shell:fullscreen{background:#101b35;padding:8px}.reader-shell:fullscreen .viewer{height:calc(100vh - 60px)}.hidden{display:none!important}</style></head><body><div class="app"><header><a class="brand" href="index.html">← EXAM JUNCTION</a><a href="notifications.html">🔔 Alerts</a></header><main><h1>📚 Books & Notes</h1><p class="muted">Free study material aur aapke approved restricted books.</p><input id="search" class="search" type="search" placeholder="Book ya author search karein"><div id="status" class="notice">Books load ho rahi hain…</div><div id="list" class="list"></div><div id="viewer-wrap" class="book hidden"><h2 id="viewer-title"></h2><button class="btn" id="close">Close preview</button><div id="viewer"></div></div></main><nav aria-label="Main navigation"><a href="index.html">⌂<br>Home</a><a href="batch.html">▤<br>Batch</a><a class="active" href="books.html" aria-current="page">▣<br>Books</a><a href="leaderboard.html">♛<br>Leaderboard</a><a href="about.html">ⓘ<br>About</a></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script>
(async()=>{
"use strict";
const $=id=>document.getElementById(id);
if(!window.EXAM_JUNCTION||!await window.EXAM_JUNCTION.init()){$("status").textContent="Connection unavailable. Internet check karke refresh karein.";return}
const db=window.EXAM_JUNCTION.supabase;
let books=[];
let currentUser=null;
let bookRequests=new Map();
const safeHttps=value=>{try{const u=new URL(String(value||""));return u.protocol==="https:"&&u.hostname?u.href:""}catch(_){return ""}};
function normalizeStudyUrl(value){
 const raw=safeHttps(value);if(!raw)return "";
 try{
  const u=new URL(raw);
  if(u.hostname==="drive.google.com"||u.hostname==="docs.google.com"){
   const m=u.pathname.match(/\/file\/d\/([^/]+)/)||u.pathname.match(/\/(?:document|spreadsheets|presentation)\/d\/([^/]+)/);
   const id=m?m[1]:((u.pathname==="/open"||u.pathname==="/uc")?u.searchParams.get("id"):"");
   if(id&&u.hostname==="drive.google.com")return "https://drive.google.com/file/d/"+encodeURIComponent(id)+"/preview";
   if(id&&u.hostname==="docs.google.com")return "https://docs.google.com"+u.pathname.replace(/\/edit.*$/,"/preview");
  }
  return raw;
 }catch(_){return ""}
}
async function resolveFileUrl(book,{download=false,original=false}={}){
 if(book.storage_bucket==="ej-private-content"&&book.storage_path){
  const options=download?{download:(book.title||"study-material")+".pdf"}:undefined;
  const {data,error}=await db.storage.from("ej-private-content").createSignedUrl(book.storage_path,300,options);
  if(error||!data?.signedUrl)throw error||new Error("Secure PDF link nahi mila.");
  return data.signedUrl;
 }
 const raw=download?(book.download_url||book.external_url||book.storage_path):(original?(book.external_url||book.storage_path):(book.external_url||book.storage_path));
 const url=normalizeStudyUrl(raw);
 if(!url)throw new Error("Book ka valid HTTPS PDF link available nahi hai.");
 return url;
}
const canOriginal=book=>book.access_type!=="restricted"||book.original_link_allowed===true;
async function downloadBook(book){
 if(book.access_type==="restricted"&&!book.isAccessible){alert("Is book ka access approve nahi hua hai.");return;}
 try{const url=await resolveFileUrl(book,{download:true});window.open(url,"_blank","noopener,noreferrer")}catch(e){alert("Download available nahi hai. Admin se contact karein.");console.error("Book download error",e)}
}
try{const auth=await db.auth.getUser();currentUser=auth?.data?.user||null;}catch(_){}
if(currentUser){try{const {data:reqs,error:reqErr}=await db.from("book_access_requests").select("book_id,status").eq("student_id",currentUser.id);if(!reqErr)(reqs||[]).forEach(r=>bookRequests.set(r.book_id,r.status));}catch(e){console.warn("Book request status unavailable",e)}}
try{
 const {data:catalog,error:catalogError}=await db.from("public_book_catalog").select("id,title,author,description,access_type,created_at").order("created_at",{ascending:false}).limit(100);
 if(catalogError)throw catalogError;
 const {data:allowed,error:allowedError}=await db.from("books").select("id,title,author,description,cover_path,storage_path,storage_bucket,external_url,access_type,download_url,download_allowed,original_link_allowed,publication_status,created_at").eq("is_published",true).order("created_at",{ascending:false}).limit(100);
 if(allowedError)throw allowedError;
 const allowedById=new Map((allowed||[]).map(b=>[b.id,b]));
 books=(catalog||[]).map(meta=>({...meta,...(allowedById.get(meta.id)||{}),isAccessible:allowedById.has(meta.id)}));
 $("status").classList.toggle("hidden",books.length>0);if(!books.length)$("status").textContent="Abhi koi published book nahi hai.";render();
}catch(e){console.error("Books load error",e);$("status").textContent="Books load nahi hui. Internet ya database policy check karein."}
function render(){
 const q=$("search").value.trim().toLowerCase(),list=$("list");list.replaceChildren();
 const filtered=books.filter(b=>[b.title,b.author,b.description].join(" ").toLowerCase().includes(q));
 if(!filtered.length){$("status").classList.remove("hidden");$("status").textContent="Koi matching book nahi mili.";return}
 $("status").classList.add("hidden");
 filtered.forEach(b=>{
  const card=document.createElement("article");card.className="book";
  const badge=document.createElement("span");badge.className="badge "+(b.access_type==="restricted"?"restricted":"");badge.textContent=b.access_type==="restricted"?"🔒 SELECTED STUDENTS":"FREE";
  const h=document.createElement("h2");h.textContent=b.title||"Study Book";
  const p=document.createElement("p");p.className="muted";p.textContent=(b.author?"Author: "+b.author+" • ":"")+(b.description||"");
  const btn=document.createElement("button");btn.className="btn";
  if(b.access_type==="restricted"&&!b.isAccessible){
   const requestStatus=bookRequests.get(b.id);
   const reason=document.createElement("textarea");reason.rows=2;reason.maxLength=300;reason.placeholder="Request reason (optional)";reason.setAttribute("aria-label","Request reason for "+(b.title||"book"));reason.style.cssText="display:block;width:100%;margin-top:10px;padding:10px;border:1px solid #dfe6f0;border-radius:9px;font:inherit;font-size:13px;"+(currentUser&&requestStatus!=="pending"?"":"display:none;");
   btn.textContent=!currentUser?"🔐 Login to Access":requestStatus==="pending"?"⏳ Request Pending":requestStatus==="rejected"?"🔁 Request Access Again":"📨 Request Access";
   btn.disabled=!!currentUser&&requestStatus==="pending";
   btn.onclick=async()=>{if(!currentUser){window.location.href="login.html?next="+encodeURIComponent("books.html");return;}if(bookRequests.get(b.id)==="pending")return;
    btn.disabled=true;btn.textContent="Sending...";
    try{const payload={student_id:currentUser.id,book_id:b.id,status:"pending",reason:String(reason.value||"").trim().slice(0,300)||null,updated_at:new Date().toISOString()};const {error}=await db.from("book_access_requests").upsert(payload,{onConflict:"student_id,book_id"});if(error)throw error;bookRequests.set(b.id,"pending");reason.style.display="none";btn.textContent="⏳ Request Pending";btn.disabled=true;}
    catch(e){console.error("Book access request failed",e);btn.disabled=false;btn.textContent="📨 Request Access";alert("Request nahi bheji ja saki. Dobara try karein.");}
   };
  }else{btn.textContent="📖 View PDF";btn.onclick=()=>openBook(b);}
  const actions=document.createElement("div");actions.className="reader-actions";actions.append(btn);
  if(b.isAccessible&&b.download_allowed&&(b.download_url||b.storage_bucket==="ej-private-content")){const dl=document.createElement("button");dl.className="btn";dl.textContent="⬇ Download";dl.onclick=()=>downloadBook(b);actions.append(dl)}
  card.append(badge,h);if(b.author||b.description)card.append(p);if(b.access_type==="restricted"&&!b.isAccessible&&currentUser){card.append(reason)}card.append(actions);list.append(card);
 });
}
async function openBook(book){
 try{
  const url=await resolveFileUrl(book);
  $("viewer-title").textContent=book.title||"Book Preview";$("viewer").replaceChildren();
  const shell=document.createElement("div");shell.className="reader-shell";
  const actions=document.createElement("div");actions.className="reader-actions";
  const full=document.createElement("button");full.className="btn";full.textContent="⛶ Full screen";full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await shell.requestFullscreen()}catch(_){alert("Full screen is browser/device par supported nahi hai.")}};actions.append(full);
  if(canOriginal(book)){const original=document.createElement("button");original.className="btn";original.textContent="↗ Open Original Link";original.onclick=async()=>{try{const originalUrl=await resolveFileUrl(book,{original:true});window.open(originalUrl,"_blank","noopener,noreferrer")}catch(e){alert("Original link available nahi hai.");console.error(e)}};actions.append(original)}
  if(book.download_allowed&&(book.download_url||book.storage_bucket==="ej-private-content")){const dl=document.createElement("button");dl.className="btn";dl.textContent="⬇ Download PDF";dl.onclick=()=>downloadBook(book);actions.append(dl)}
  shell.append(actions);
  const frame=document.createElement("iframe");frame.className="viewer";frame.src=url;frame.title=book.title||"Book preview";frame.loading="lazy";frame.referrerPolicy="no-referrer";shell.append(frame);
  $("viewer").append(shell);$("viewer-wrap").classList.remove("hidden");$("viewer-wrap").scrollIntoView({behavior:"smooth"});
 }catch(e){alert("PDF open nahi hua. Link ya access permission check karein.");console.error("Book viewer error",e)}
}
$("search").addEventListener("input",render);$("close").onclick=()=>$("viewer-wrap").classList.add("hidden");
})();
</script>
</body>
</html>
