<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b55"><title>Books & Notes | EXAM JUNCTION</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17243a;font-family:Arial,sans-serif;padding-bottom:78px}.app{max-width:760px;margin:auto;min-height:100vh}header{padding:17px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;justify-content:space-between;align-items:center}.brand{color:#173b73;font-weight:900;text-decoration:none}main{padding:20px 16px}h1,h2,h3{color:#10274c}.muted{color:#718096;font-size:13px;line-height:1.6}.search{width:100%;padding:14px;border:1px solid #dfe6f0;border-radius:12px;margin:16px 0}.list{display:grid;gap:12px}.book{background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px}.badge{display:inline-block;padding:5px 8px;border-radius:7px;background:#eaf8f0;color:#176b43;font-size:11px;font-weight:bold}.restricted{background:#fff3dd;color:#875b0a}.btn{display:inline-block;margin-top:10px;background:#173b73;color:white;padding:11px 14px;border-radius:10px;text-decoration:none;border:0;font-weight:bold}.notice{padding:20px;text-align:center;background:white;border:1px dashed #cbd6e5;border-radius:14px;color:#718096}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:white;border-top:1px solid #e6ebf2}nav a{text-align:center;color:#68768b;text-decoration:none;font-size:11px;padding:6px}nav .active{color:#173b73;font-weight:bold}.viewer{width:100%;height:70vh;border:0;margin-top:12px;border-radius:10px}.hidden{display:none!important}</style></head><body><div class="app"><header><a class="brand" href="index.html">← EXAM JUNCTION</a><a href="notifications.html">🔔 Alerts</a></header><main><h1>📚 Books & Notes</h1><p class="muted">Free study material aur aapke approved restricted books.</p><input id="search" class="search" type="search" placeholder="Book ya author search karein"><div id="status" class="notice">Books load ho rahi hain…</div><div id="list" class="list"></div><div id="viewer-wrap" class="book hidden"><h2 id="viewer-title"></h2><button class="btn" id="close">Close preview</button><div id="viewer"></div></div></main><nav><a href="index.html">⌂<br>Home</a><a href="batch.html">▤<br>Batch</a><a class="active" href="books.html">▣<br>Books</a><a href="about.html">ⓘ<br>About</a></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),dbReady=await window.EXAM_JUNCTION.init();if(!dbReady){$("status").textContent="Connection unavailable.";return}const db=window.EXAM_JUNCTION.supabase;let books=[];try{const {data,error}=await db.from("books").select("id,title,author,description,cover_path,storage_path,external_url,access_type,created_at").eq("is_published",true).order("created_at",{ascending:false}).limit(100);if(error)throw error;books=data||[];$("status").classList.toggle("hidden",books.length>0);if(!books.length)$("status").textContent="Abhi koi aisi published book nahi hai jiska aapko access ho.";render();}catch(e){console.error(e);$("status").textContent="Books load nahi hui. Login ya database policy check karein."}
function render(){const q=$("search").value.trim().toLowerCase(),list=$("list");list.replaceChildren();const filtered=books.filter(b=>[b.title,b.author,b.description].join(" ").toLowerCase().includes(q));if(!filtered.length){$("status").classList.remove("hidden");$("status").textContent="Koi matching book nahi mili.";return}$("status").classList.add("hidden");filtered.forEach(b=>{const card=document.createElement("article");card.className="book";const badge=document.createElement("span");badge.className="badge "+(b.access_type==="restricted"?"restricted":"");badge.textContent=b.access_type==="restricted"?"🔒 APPROVED ACCESS":"FREE";const h=document.createElement("h2");h.textContent=b.title||"Study Book";const p=document.createElement("p");p.className="muted";p.textContent=(b.author?"Author: "+b.author+" • ":"")+(b.description||"Study material");const btn=document.createElement("button");btn.className="btn";btn.textContent="Open preview";btn.onclick=()=>openBook(b);card.append(badge,h,p,btn);list.append(card)})}
async function openBook(b){let url=b.external_url||"";if(b.storage_path){if(/^https?:\/\//i.test(b.storage_path))url=b.storage_path;else{const {data,error}=await db.storage.from("study-materials").createSignedUrl(b.storage_path,300);if(error||!data?.signedUrl){alert("Book file ka secure preview link nahi bana. Admin se bucket aur path check karwayein.");return}url=data.signedUrl}}if(url.includes("drive.google.com/file/d/"))url=url.replace(/\/view(?:\?.*)?$/,"/preview");if(!url){alert("Book ka PDF/link admin panel mein add nahi hai.");return}$("viewer-title").textContent=b.title||"Book Preview";$("viewer").replaceChildren();const frame=document.createElement("iframe");frame.className="viewer";frame.src=url;frame.title=b.title||"Book preview";frame.loading="lazy";$("viewer").append(frame);$("viewer-wrap").classList.remove("hidden");$("viewer-wrap").scrollIntoView({behavior:"smooth"})}
$("search").addEventListener("input",render);$("close").onclick=()=>$("viewer-wrap").classList.add("hidden");
})();
</script></body></html>
