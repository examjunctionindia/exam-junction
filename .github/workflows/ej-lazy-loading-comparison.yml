name: EXAM JUNCTION Lazy Loading Before After Comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ej-lazy-loading-comparison.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Measure request counts, response bytes and loading time over three runs
        env:
          SITE_URL: "https://exam-junction.pages.dev"
          FREE_BATCH_ID: "030cbf50-674c-47c1-91b1-cc8323179c31"
          BEFORE_COMMIT: "6ddd2be3265ed4a79caf128c8fd98ee89f036cc3"
        run: |
          git show "${BEFORE_COMMIT}:batch-detail.html" > batch-detail-before.html
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const oldHtml = fs.readFileSync('batch-detail-before.html','utf8');
            const url = process.env.SITE_URL + '/batch-detail.html?id=' + encodeURIComponent(process.env.FREE_BATCH_ID);

            async function measure(label, interceptOld, iteration) {
              const page = await browser.newPage({viewport:{width:390,height:844}});
              const requests = [];
              const errors = [];
              page.on('request', req => {
                if (req.url().includes('/rest/v1/')) requests.push({url:req.url(), started:Date.now(), method:req.method(), bytes:0});
              });
              page.on('response', async response => {
                const req=response.request();
                if(!req.url().includes('/rest/v1/')) return;
                const item=requests.findLast(x=>x.url===req.url()&&x.method===req.method()&&x.bytes===0);
                if(item) {
                  try { item.bytes=(await response.body()).byteLength; item.status=response.status(); }
                  catch(e) { item.bodyReadError=String(e); }
                }
              });
              page.on('requestfinished', req => {
                const item = requests.findLast(x=>x.url===req.url()&&x.method===req.method()&&x.ms==null);
                if(item)item.ms=Date.now()-item.started;
              });
              page.on('requestfailed', req => {
                const item = requests.findLast(x=>x.url===req.url()&&x.method===req.method()&&x.ms==null);
                if(item){item.ms=Date.now()-item.started;item.failed=req.failure()?.errorText||'failed';}
                if(req.url().includes('/rest/v1/')) errors.push({url:req.url(),failure:req.failure()?.errorText||'failed'});
              });
              page.on('pageerror', e=>errors.push({pageError:String(e)}));
              if(interceptOld) await page.route('**/batch-detail.html?id=*', route=>route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:oldHtml}));
              const started=Date.now();
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.locator('#title').waitFor({state:'attached',timeout:12000}).catch(()=>{});
              await page.waitForFunction(()=> {
                const title=document.querySelector('#title')?.textContent?.trim();
                const status=document.querySelector('#status');
                return !!title && (!status || status.hidden || getComputedStyle(status).display==='none');
              },null,{timeout:15000}).catch(()=>{});
              const readyMs=Date.now()-started;
              // Same 2.5-second post-ready measurement window for both versions.
              await page.waitForTimeout(2500);
              const report={
                version:label, iteration,
                pageStatus:response?.status()??null,
                title:(await page.locator('#title').textContent().catch(()=>''))?.trim(),
                readyMs,
                observationWindowMs:Date.now()-started,
                totalSupabaseRestRequests:requests.length,
                lectureAndChapterNoteRequests:requests.filter(x=>/\/rest\/v1\/(lectures|chapter_notes)\?/.test(x.url)).length,
                totalSupabaseRestResponseBytes:requests.reduce((sum,x)=>sum+(x.bytes||0),0),
                lectureAndChapterNoteResponseBytes:requests.filter(x=>/\/rest\/v1\/(lectures|chapter_notes)\?/.test(x.url)).reduce((sum,x)=>sum+(x.bytes||0),0),
                failedSupabaseRequests:requests.filter(x=>x.failed||(x.status>=400)).length,
                errors:errors.slice(0,5)
              };
              await page.close();
              return report;
            }

            const runs=[];
            for(let i=1;i<=3;i++) {
              runs.push(await measure('BEFORE lazy-loading (historical HTML)',true,i));
              await new Promise(r=>setTimeout(r,700));
              runs.push(await measure('AFTER lazy-loading (live HTML)',false,i));
              await new Promise(r=>setTimeout(r,700));
            }
            function summarize(label) {
              const xs=runs.filter(x=>x.version.startsWith(label));
              const avg=key=>Math.round(xs.reduce((sum,x)=>sum+x[key],0)/xs.length);
              return {
                version:label, runs:xs.length,
                averageReadyMs:avg('readyMs'),
                averageTotalSupabaseRestRequests:avg('totalSupabaseRestRequests'),
                averageLectureAndChapterNoteRequests:avg('lectureAndChapterNoteRequests'),
                averageSupabaseRestResponseBytes:avg('totalSupabaseRestResponseBytes'),
                averageLectureAndChapterNoteResponseBytes:avg('lectureAndChapterNoteResponseBytes'),
                totalFailures:xs.reduce((sum,x)=>sum+x.failedSupabaseRequests,0),
                pageStatuses:xs.map(x=>x.pageStatus)
              };
            }
            const before=summarize('BEFORE');
            const after=summarize('AFTER');
            const percent=(a,b)=>a===0?null:Math.round((a-b)/a*1000)/10;
            console.log('LAZY_LOADING_COMPARISON='+JSON.stringify({
              before,after,
              comparison:{
                averageReadyTimeImprovementPercent:percent(before.averageReadyMs,after.averageReadyMs),
                averageSupabaseResponseBytesReductionPercent:percent(before.averageSupabaseRestResponseBytes,after.averageSupabaseRestResponseBytes),
                averageLectureAndNotesResponseBytesReductionPercent:percent(before.averageLectureAndChapterNoteResponseBytes,after.averageLectureAndChapterNoteResponseBytes),
                averageRequestCountReduction:before.averageTotalSupabaseRestRequests-after.averageTotalSupabaseRestRequests
              },
              runs,
              note:'Three sequential paired runs against the same public batch and origin. Browser-measured response body bytes are not the same as provider-billed network egress; timing may vary with network/cache.'
            },null,2));
            await browser.close();
            if(runs.some(x=>x.pageStatus!==200||x.failedSupabaseRequests>0))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
