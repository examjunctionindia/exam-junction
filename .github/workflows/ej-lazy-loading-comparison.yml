name: EXAM JUNCTION Lazy Loading Before After Comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ej-lazy-loading-comparison.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Run same public batch scenario against pre-change and current HTML
        env:
          SITE_URL: "https://exam-junction.pages.dev"
          FREE_BATCH_ID: "6847de07-0630-4975-bfb7-7e1ffbd5bca0"
          BEFORE_COMMIT: "6ddd2be3265ed4a79caf128c8fd98ee89f036cc3"
        run: |
          git show "${BEFORE_COMMIT}:batch-detail.html" > batch-detail-before.html
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const oldHtml = fs.readFileSync('batch-detail-before.html','utf8');
            const url = process.env.SITE_URL + '/batch-detail.html?id=' + encodeURIComponent(process.env.FREE_BATCH_ID);

            async function measure(label, interceptOld) {
              const page = await browser.newPage({viewport:{width:390,height:844}});
              const requests = [];
              const errors = [];
              page.on('request', req => {
                if (req.url().includes('/rest/v1/')) requests.push({url:req.url(), started:Date.now(), method:req.method()});
              });
              page.on('requestfinished', req => {
                const item = requests.findLast(x=>x.url===req.url()&&x.method===req.method()&&x.ms==null);
                if(item)item.ms=Date.now()-item.started;
              });
              page.on('requestfailed', req => {
                const item = requests.findLast(x=>x.url===req.url()&&x.method===req.method()&&x.ms==null);
                if(item){item.ms=Date.now()-item.started;item.failed=req.failure()?.errorText||'failed';}
                if(req.url().includes('/rest/v1/')) errors.push({url:req.url(),failure:req.failure()?.errorText||'failed'});
              });
              page.on('pageerror', e=>errors.push({pageError:String(e)}));
              if(interceptOld) await page.route('**/batch-detail.html?id=*', route=>route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:oldHtml}));
              const started=Date.now();
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.locator('#title').waitFor({state:'attached',timeout:12000}).catch(()=>{});
              await page.waitForFunction(()=> {
                const title=document.querySelector('#title')?.textContent?.trim();
                const status=document.querySelector('#status');
                return !!title && (!status || status.hidden || getComputedStyle(status).display==='none');
              },null,{timeout:15000}).catch(()=>{});
              // Same fixed observation window after the title/status is ready, so late initial requests are counted.
              const readyMs=Date.now()-started;
              await page.waitForTimeout(2500);
              const report={
                version:label,
                pageStatus:response?.status()??null,
                title:(await page.locator('#title').textContent().catch(()=>''))?.trim(),
                readyMs,
                observationWindowMs:Date.now()-started,
                totalSupabaseRestRequests:requests.length,
                lectureAndChapterNoteRequests:requests.filter(x=>/\/rest\/v1\/(lectures|chapter_notes)\?/.test(x.url)).length,
                failedSupabaseRequests:requests.filter(x=>x.failed).length,
                requestDurationsMs:requests.filter(x=>Number.isFinite(x.ms)).map(x=>x.ms),
                errors:errors.slice(0,5)
              };
              await page.close();
              return report;
            }
            // Run sequentially against the same live origin and public batch to reduce cross-test interference.
            const before=await measure('BEFORE lazy-loading (historical HTML)',true);
            await new Promise(r=>setTimeout(r,1000));
            const after=await measure('AFTER lazy-loading (live HTML)',false);
            console.log('LAZY_LOADING_COMPARISON='+JSON.stringify({before,after,interpretation:'Same batch, same browser viewport, same live origin and same post-ready observation window. Run sequentially; network variance remains possible.'},null,2));
            await browser.close();
            if(before.pageStatus!==200||after.pageStatus!==200||before.failedSupabaseRequests||after.failedSupabaseRequests)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
