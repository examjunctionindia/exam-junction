name: EXAM JUNCTION Batch Detail Browser Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "batch-detail.html"
      - ".github/workflows/ej-batch-detail-browser-test.yml"

permissions:
  contents: read

jobs:
  batch-detail-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Test live EXAM JUNCTION batch detail in a real browser
        env:
          SITE_URL: "https://exam-junction.pages.dev"
          FREE_BATCH_ID: "6847de07-0630-4975-bfb7-7e1ffbd5bca0"
        run: |
          cat > batch-detail-browser-test.cjs <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const started = Date.now();
            const restRequests = [];
            const consoleErrors = [];
            const pageErrors = [];
            const failedResources = [];
            const httpErrors = [];
            let contentReadyMs = null;
            page.on('pageerror', error => pageErrors.push(String(error?.stack || error)));
            page.on('requestfailed', req => { if (!req.url().includes('/rest/v1/')) failedResources.push({url:req.url(),failure:req.failure()?.errorText || 'request failed'}); });
            page.on('response', response => {
              if (response.status() >= 400) {
                response.text().then(body => httpErrors.push({ status: response.status(), url: response.url(), body: String(body || '').slice(0, 500) })).catch(() => httpErrors.push({ status: response.status(), url: response.url(), body: 'response body unavailable' }));
              }
            });
            page.on('request', req => {
              if (req.url().includes('/rest/v1/')) {
                restRequests.push({ url: req.url(), startedAt: Date.now(), method: req.method() });
              }
            });
            page.on('requestfinished', req => {
              const item = restRequests.findLast(x => x.url === req.url() && x.method === req.method() && x.durationMs == null);
              if (item) item.durationMs = Date.now() - item.startedAt;
            });
            page.on('requestfailed', req => {
              const item = restRequests.findLast(x => x.url === req.url() && x.method === req.method() && x.durationMs == null);
              if (item) { item.durationMs = Date.now() - item.startedAt; item.failed = req.failure()?.errorText || 'request failed'; }
            });
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            const url = process.env.SITE_URL + '/batch-detail.html?id=' + encodeURIComponent(process.env.FREE_BATCH_ID);
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.locator('#status').waitFor({ state: 'hidden', timeout: 12000 }).catch(() => {});
            // The status banner hides before chapter data finishes loading; wait for actual chapter DOM.
            await page.locator('#chapters > .chapter').first().waitFor({ state: 'attached', timeout: 12000 }).catch(() => {});
            contentReadyMs = Date.now() - started;
            const navigationTiming = await page.evaluate(() => {
              const n = performance.getEntriesByType('navigation')[0];
              return n ? { domContentLoadedMs: Math.round(n.domContentLoadedEventEnd), loadEventMs: Math.round(n.loadEventEnd), responseStartMs: Math.round(n.responseStart) } : null;
            });
            const initialLoadMs = contentReadyMs;
            await page.waitForTimeout(500);
            const title = await page.locator('#title').textContent().catch(() => '');
            const statusText = await page.locator('#status').textContent().catch(() => 'status element missing');
            const domDiagnostic = await page.evaluate(() => ({readyState:document.readyState, scripts:[...document.scripts].map(s=>({src:s.src||'inline',loaded:!s.src||s.dataset.loaded==='true'})), configPresent:!!window.EXAM_JUNCTION_CONFIG, ejPresent:!!window.EXAM_JUNCTION, supabasePresent:!!window.supabase?.createClient}));
            const inlineScriptSyntaxErrors = await page.evaluate(() => [...document.scripts].filter(s=>!s.src).map((s,i)=>{try{new Function(s.textContent);return null}catch(e){return {index:i,error:String(e)}}}).filter(Boolean));
            const chapterCount = await page.locator('#chapters > .chapter').count().catch(() => 0);
            const initialContentRequests = restRequests.filter(x => /\/rest\/v1\/(lectures|chapter_notes)\?/.test(x.url)).length;
            let openedChapter = false;
            if (chapterCount > 0) {
              const targetChapter = page.locator('#chapters > .chapter > summary').nth(1);
              if (await targetChapter.count()) await targetChapter.click();
              else await page.locator('#chapters > .chapter > summary').first().click();
              await page.waitForTimeout(2500);
              openedChapter = true;
            }
            // Exercise cross-chapter search, notes rendering, and lecture navigation without writes.
            const search = page.locator('input[aria-label="Search chapters or lectures"]');
            let chapterSearchPassed = false;
            let lectureCountAfterSearch = 0;
            let noteCountAfterSearch = 0;
            let navigationButtonCount = 0;
            let navigationClicked = false;
            if (await search.count()) {
              await search.fill('chapter 02');
              await page.waitForTimeout(1500);
              chapterSearchPassed = await page.locator('#chapters > .chapter').nth(1).isVisible().catch(() => false);
              await search.fill('');
              await page.waitForTimeout(500);
              lectureCountAfterSearch = await page.locator('#chapters .lecture-accordion').count();
              noteCountAfterSearch = await page.locator('#chapters [data-note-search]').count();
              navigationButtonCount = await page.locator('#chapters .lecture-navigation button').count();
              const firstLectureSummary = page.locator('#chapters > .chapter').first().locator('.lecture-accordion > summary').first();
              if (await firstLectureSummary.count()) await firstLectureSummary.click();
              const nextLecture = page.locator('#chapters .lecture-navigation button').filter({ hasText: /Next Lecture|Next Chapter/ }).first();
              if (await nextLecture.count()) {
                await nextLecture.click();
                await page.waitForTimeout(700);
                navigationClicked = true;
              }
              let previousChapterNavigationPassed = false;
              const secondChapterFirstLecture = page.locator('#chapters > .chapter').nth(1).locator('.lecture-accordion > summary').first();
              if (await secondChapterFirstLecture.count()) {
                await secondChapterFirstLecture.click();
                const previousChapterButton = page.locator('#chapters > .chapter').nth(1).locator('.lecture-navigation button').filter({ hasText: /Previous Chapter/ }).first();
                if (await previousChapterButton.count()) {
                  await previousChapterButton.click();
                  await page.waitForTimeout(500);
                  previousChapterNavigationPassed = await page.locator('#chapters > .chapter').first().isVisible().catch(() => false);
                }
              }
              const noteTitle = await page.locator('#chapters [data-note-search]').first().getAttribute('data-note-search').catch(() => null);
              if (noteTitle) {
                await search.fill(noteTitle.slice(0, 20));
                await page.waitForTimeout(1200);
                await search.fill('');
                await page.waitForTimeout(300);
              }
            }
            const finalContentRequests = restRequests.filter(x => /\/rest\/v1\/(lectures|chapter_notes)\?/.test(x.url)).length;
            const failures = restRequests.filter(x => x.failed);
            const report = {
              test: 'live browser; public batch detail only; no login, writes, or media streaming',
              site: process.env.SITE_URL,
              pageStatus: response?.status() ?? null,
              title: (title || '').trim(),
              statusText: (statusText || '').trim(),
              domDiagnostic,
              inlineScriptSyntaxErrors,
              pageErrors: pageErrors.slice(0, 10),
              failedResources: failedResources.slice(0, 10),
              contentReadyMs,
              initialLoadMs,
              navigationTiming,
              chaptersRendered: chapterCount,
              chapterOpenTriggered: openedChapter,
              chapterSearchPassed,
              lectureCountAfterSearch,
              noteCountAfterSearch,
              navigationButtonCount,
              navigationClicked,
              previousChapterNavigationPassed,
              supabaseRestRequestsTotal: restRequests.length,
              lectureAndChapterNoteRequestsBeforeOpeningChapter: initialContentRequests,
              lectureAndChapterNoteRequestsAfterOpeningChapter: finalContentRequests,
              supabaseRequestFailures: failures.length,
              failedRequestDetails: failures.slice(0, 5),
              httpErrors: httpErrors.slice(0, 10),
              browserConsoleErrors: consoleErrors.slice(0, 10)
            };
            console.log('BATCH_DETAIL_BROWSER_REPORT=' + JSON.stringify(report, null, 2));
            await browser.close();
            if (response?.status() !== 200) process.exitCode = 1;
            if (!title || !title.trim()) process.exitCode = 1;
            if (chapterCount < 1) process.exitCode = 1;
            if (!openedChapter) process.exitCode = 1;
            if (failures.length > 0) process.exitCode = 1;
            if (!chapterSearchPassed) process.exitCode = 1;
            if (lectureCountAfterSearch < 1) process.exitCode = 1;
            if (navigationButtonCount < 1 || !navigationClicked) process.exitCode = 1;
            if (!previousChapterNavigationPassed) process.exitCode = 1;
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node batch-detail-browser-test.cjs
