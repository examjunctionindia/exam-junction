name: EXAM JUNCTION Student Page Load Test

on:
  workflow_dispatch:
    inputs:
      max_users:
        description: "Maximum simulated users (10, 25, 50, or 100)"
        required: true
        type: choice
        options:
          - "10"
          - "25"
          - "50"
          - "100"
        default: "10"

permissions:
  contents: read

jobs:
  student-page-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.3.0"

      - name: Run public student batch page and database read test
        env:
          MAX_USERS: ${{ inputs.max_users }}
          SITE_URL: "https://examjunctionindia.github.io/exam-junction"
          SUPABASE_URL: "https://yzvwxautsauevfspdqnw.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_dcZFmdlOIQTUzbRUtjNNMA_POLJQHnP"
          FREE_BATCH_ID: "c0ab40d6-0b01-47d4-9e3e-765f674fcbb5"
        run: |
          cat > student-page-load-test.js <<'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          const maxUsers = Number(__ENV.MAX_USERS || '10');
          const site = __ENV.SITE_URL;
          const supabase = __ENV.SUPABASE_URL;
          const key = __ENV.SUPABASE_PUBLISHABLE_KEY;
          const batchId = __ENV.FREE_BATCH_ID;
          const headers = {
            apikey: key,
            Authorization: 'Bearer ' + key,
            Accept: 'application/json',
          };

          export const options = {
            stages: [
              { duration: '15s', target: Math.min(10, maxUsers) },
              { duration: '20s', target: Math.min(10, maxUsers) },
              ...(maxUsers >= 25 ? [{ duration: '10s', target: 25 }, { duration: '20s', target: 25 }] : []),
              ...(maxUsers >= 50 ? [{ duration: '10s', target: 50 }, { duration: '20s', target: 50 }] : []),
              ...(maxUsers >= 100 ? [{ duration: '10s', target: 100 }, { duration: '25s', target: 100 }] : []),
              { duration: '10s', target: 0 },
            ],
            summaryTrendStats: ['avg', 'min', 'med', 'max', 'p(90)', 'p(95)', 'p(99)'],
            thresholds: {
              http_req_failed: ['rate<0.05'],
              http_req_duration: ['p(95)<5000'],
            },
          };

          function getJson(url, name) {
            const r = http.get(url, { headers, timeout: '20s', tags: { request: name } });
            const ok = check(r, {
              [name + ' HTTP 200']: (x) => x.status === 200,
              [name + ' valid JSON']: (x) => {
                try { JSON.parse(x.body); return true; } catch (_) { return false; }
              },
            });
            if (!ok || r.status !== 200) return null;
            try { return JSON.parse(r.body); } catch (_) { return null; }
          }

          export default function () {
            const page = http.get(site + '/batch-detail.html?id=' + batchId, { timeout: '20s', tags: { request: 'student_batch_page' } });
            check(page, {
              'student batch page returns HTTP 200': (r) => r.status === 200,
              'student page HTML received': (r) => (r.headers['Content-Type'] || '').includes('text/html'),
            });

            const batch = getJson(
              supabase + '/rest/v1/batches?id=eq.' + batchId + '&is_published=eq.true&select=id,title,access_type,is_published',
              'public_batch_read'
            );

            const chapters = getJson(
              supabase + '/rest/v1/chapters?batch_id=eq.' + batchId + '&is_published=eq.true&select=id,title,position&order=position.asc&limit=500',
              'published_chapters_read'
            );

            if (Array.isArray(chapters) && chapters.length > 0) {
              const ids = chapters.map((c) => c.id).filter(Boolean);
              if (ids.length) {
                const chapterFilter = ids.join(',');
                getJson(
                  supabase + '/rest/v1/lectures?chapter_id=in.(' + chapterFilter + ')&is_published=eq.true&select=id,chapter_id,title,position&order=position.asc&limit=500',
                  'published_lectures_read'
                );
                getJson(
                  supabase + '/rest/v1/chapter_notes?chapter_id=in.(' + chapterFilter + ')&is_published=eq.true&select=id,chapter_id,title,position&order=position.asc&limit=500',
                  'published_chapter_notes_read'
                );
              }
            }

            check({ data: batch }, {
              'free published batch visible to public key': (x) => Array.isArray(x.data) && x.data.length > 0,
            });
            sleep(1);
          }

          export function handleSummary(data) {
            const m = data.metrics;
            const summary = [
              '# EXAM JUNCTION Student Page Load Test',
              '',
              '- Test type: public free-batch page + public Supabase read requests; no login, no writes, no video streams',
              '- Requested maximum virtual users: ' + maxUsers,
              '- Batch ID: ' + batchId,
              '- Total HTTP requests: ' + (m.http_reqs?.values?.count ?? 'n/a'),
              '- Failed HTTP requests: ' + (m.http_req_failed?.values?.passes ?? 'n/a'),
              '- Successful HTTP requests: ' + (m.http_req_failed?.values?.fails ?? 'n/a'),
              '- HTTP failure rate (%): ' + (m.http_req_failed?.values?.rate != null ? (m.http_req_failed.values.rate * 100).toFixed(2) : 'n/a'),
              '- Average HTTP response time (ms): ' + (m.http_req_duration?.values?.avg?.toFixed(1) ?? 'n/a'),
              '- p95 HTTP response time (ms): ' + (m.http_req_duration?.values?.['p(95)']?.toFixed(1) ?? 'n/a'),
              '- p99 HTTP response time (ms): ' + (m.http_req_duration?.values?.['p(99)']?.toFixed(1) ?? 'n/a'),
              '',
              'Important: this checks public batch/chapter/lecture/notes reads, not restricted-student authorization or concurrent video delivery.'
            ].join('\n');
            return { stdout: summary + '\n' };
          }
          EOF
          k6 run student-page-load-test.js
