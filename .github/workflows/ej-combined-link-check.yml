          ]
          rows=[]
          for url in urls:
            status="ERROR"; detail=""
            try:
              req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 EXAM-JUNCTION-LinkCheck","Range":"bytes=0-1023"}, method="GET")
              with urllib.request.urlopen(req, timeout=15) as r:
                status=str(r.status)
                data=r.read(2048)
                detail="type="+str(r.headers.get("Content-Type",""))+"; bytes="+str(len(data))
                if url.lower().endswith(".m3u8"):
                  body=data.decode("utf-8","ignore")
                  detail += "; playlist_marker="+str("#EXTM3U" in body)
            except urllib.error.HTTPError as e:
              status=str(e.code); detail=str(e.reason)
            except Exception as e:
              detail=str(e)[:180]
            print(status, urllib.parse.urlparse(url).netloc, url, detail)
            rows.append([status,url,detail])
            time.sleep(.2)
          with open("combined-link-check-report.csv","w",newline="",encoding="utf-8") as f:
            w=csv.writer(f); w.writerow(["status","url","details"]); w.writerows(rows)
          ok=sum(1 for r in rows if r[0].startswith("2") or r[0]=="206")
          print("SUMMARY total=",len(rows),"2xx=",ok,"other=",len(rows)-ok)
          PY
      - name: Save report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-link-check-report
          path: combined-link-check-report.csv
          if-no-files-found: warn
