name: EXAM JUNCTION Controlled Load Test

on:
  workflow_dispatch:
    inputs:
      max_users:
        description: "Maximum simulated users (10, 25, 50, or 100)"
        required: true
        type: choice
        options:
          - "10"
          - "25"
          - "50"
          - "100"
        default: "10"

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.3.0"

      - name: Run controlled public-page test
        env:
          MAX_USERS: ${{ inputs.max_users }}
          TARGET_URL: "https://examjunctionindia.github.io/exam-junction/"
        run: |
          cat > load-test.js <<'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate, Trend } from 'k6/metrics';

          const failures = new Rate('failed_checks');
          const duration = new Trend('page_response_ms', true);
          const maxUsers = Number(__ENV.MAX_USERS || '10');
          const url = __ENV.TARGET_URL;

          export const options = {
            stages: [
              { duration: '20s', target: Math.min(10, maxUsers) },
              { duration: '30s', target: Math.min(10, maxUsers) },
              ...(maxUsers >= 25 ? [{ duration: '15s', target: 25 }, { duration: '25s', target: 25 }] : []),
              ...(maxUsers >= 50 ? [{ duration: '15s', target: 50 }, { duration: '25s', target: 50 }] : []),
              ...(maxUsers >= 100 ? [{ duration: '20s', target: 100 }, { duration: '30s', target: 100 }] : []),
              { duration: '15s', target: 0 },
            ],
            thresholds: {
              http_req_failed: ['rate<0.05'],
              http_req_duration: ['p(95)<5000'],
            },
          };

          export default function () {
            const res = http.get(url, { redirects: 5, timeout: '20s' });
            duration.add(res.timings.duration);
            const ok = check(res, {
              'homepage returns HTTP 200': (r) => r.status === 200,
              'HTML response received': (r) => (r.headers['Content-Type'] || '').includes('text/html'),
            });
            failures.add(!ok);
            sleep(1);
          }

          export function handleSummary(data) {
            const m = data.metrics;
            const summary = [
              '# EXAM JUNCTION Load Test',
              '',
              '- Test type: public homepage HTTP load only (not video streams or authenticated database actions)',
              '- Requested maximum virtual users: ' + maxUsers,
              '- Target: ' + url,
              '- Total requests: ' + (m.http_reqs?.values?.count ?? 'n/a'),
              '- Failed HTTP requests: ' + (m.http_req_failed?.values?.passes ?? 'n/a') + ' failed: ' + (m.http_req_failed?.values?.fails ?? 'n/a'),
              '- Average response time (ms): ' + (m.http_req_duration?.values?.avg?.toFixed(1) ?? 'n/a'),
              '- p95 response time (ms): ' + (m.http_req_duration?.values?.['p(95)']?.toFixed(1) ?? 'n/a'),
              '- p99 response time (ms): ' + (m.http_req_duration?.values?.['p(99)']?.toFixed(1) ?? 'n/a'),
              '',
              'Note: this tests only the static homepage URL. It does not establish 100 concurrent video streams or full student-page capacity.'
            ].join('\n');
            return { stdout: summary + '\n' };
          }
          EOF
          k6 run load-test.js
