name: EXAM JUNCTION Video Source Startup Probe

on:
  workflow_dispatch:
    inputs:
      max_users:
        description: "Maximum concurrent virtual users for HLS playlist response checks"
        required: true
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "25"
          - "50"
          - "100"
          - "250"
          - "500"
          - "750"
          - "1000"
        default: "1"

permissions:
  contents: read

jobs:
  video-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.3.0"

      - name: Check HLS playlist startup response only
        env:
          MAX_USERS: ${{ inputs.max_users }}
          HLS_PLAYLIST_URL: "https://d14v4v80cpjht7.cloudfront.net/file_library/videos/migration/brightcove/6361863633112/6361863633112.m3u8"
        run: |
          cat > video-source-probe.js <<'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          const maxUsers = Number(__ENV.MAX_USERS || '1');
          const url = __ENV.HLS_PLAYLIST_URL;

          const stages = [
            { duration: '10s', target: maxUsers },
            { duration: '30s', target: maxUsers },
            { duration: '5s', target: 0 },
          ];

          export const options = {
            stages,
            thresholds: {
              http_req_failed: ['rate<0.05'],
              http_req_duration: ['p(95)<5000'],
              checks: ['rate>0.95'],
            },
            summaryTrendStats: ['avg', 'min', 'med', 'max', 'p(90)', 'p(95)', 'p(99)'],
          };

          export default function () {
            const r = http.get(url, {
              timeout: '15s',
              headers: { Accept: 'application/vnd.apple.mpegurl, application/x-mpegURL, */*' },
              tags: { request: 'hls_playlist_startup' },
            });
            check(r, {
              'HLS playlist HTTP 200': (x) => x.status === 200,
              'HLS playlist body contains #EXTM3U': (x) => typeof x.body === 'string' && x.body.includes('#EXTM3U'),
              'HLS playlist contains media/variant entries': (x) => typeof x.body === 'string' && (x.body.includes('#EXTINF') || x.body.includes('#EXT-X-STREAM-INF') || x.body.includes('#EXT-X-MAP')),
            });
            sleep(1);
          }

          export function handleSummary(data) {
            const m = data.metrics;
            const summary = [
              '# EXAM JUNCTION Video Source Startup Probe',
              '',
              '- Scope: HLS playlist startup response only; does NOT download video segments or test sustained playback/bandwidth.',
              '- Requested maximum virtual users: ' + maxUsers,
              '- HTTP requests: ' + (m.http_reqs?.values?.count ?? 'n/a'),
              '- HTTP failure rate (%): ' + (m.http_req_failed?.values?.rate != null ? (m.http_req_failed.values.rate * 100).toFixed(2) : 'n/a'),
              '- Checks passed: ' + (m.checks?.values?.passes ?? 'n/a'),
              '- Checks failed: ' + (m.checks?.values?.fails ?? 'n/a'),
              '- Average response (ms): ' + (m.http_req_duration?.values?.avg?.toFixed(1) ?? 'n/a'),
              '- p95 response (ms): ' + (m.http_req_duration?.values?.['p(95)']?.toFixed(1) ?? 'n/a'),
              '- p99 response (ms): ' + (m.http_req_duration?.values?.['p(99)']?.toFixed(1) ?? 'n/a'),
              '',
              'Important: this probe only checks playlist delivery. It does not establish capacity for concurrent full video playback.'
            ].join('\\n');
            return { stdout: summary + '\\n' };
          }
          EOF
          k6 run video-source-probe.js
