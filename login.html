<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102b55">

    <title>Login | EXAM JUNCTION</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f7fc;
            color: #17243a;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 410px;
        }

        .brand {
            margin-bottom: 25px;
            text-align: center;
        }

        .logo {
            display: grid;
            place-items: center;
            width: 62px;
            height: 62px;
            margin: 0 auto 13px;
            border-radius: 18px;
            background: #173b73;
            color: white;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0 8px 20px #173b7325;
        }

        .brand h1 {
            margin: 0;
            color: #10274c;
            font-size: 25px;
            font-weight: 900;
        }

        .brand p {
            margin: 7px 0 0;
            color: #718096;
            font-size: 13px;
        }

        .card {
            padding: 25px 21px;
            border: 1px solid #e5eaf2;
            border-radius: 22px;
            background: white;
            box-shadow: 0 12px 35px #17243a0b;
        }

        .card h2 {
            margin: 0;
            color: #10274c;
            font-size: 23px;
        }

        .subtitle {
            margin: 9px 0 22px;
            color: #718096;
            font-size: 13px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #263751;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 13px;
            border: 1px solid #dce3ee;
            border-radius: 11px;
            outline: none;
            background: #fff;
            color: #17243a;
            font-size: 15px;
        }

        input:focus {
            border-color: #376bc0;
            box-shadow: 0 0 0 3px #376bc018;
        }

        button {
            width: 100%;
            min-height: 49px;
            margin-top: 4px;
            border: 0;
            border-radius: 12px;
            background: #173b73;
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        button:disabled {
            opacity: .65;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fff0f0;
            color: #a12727;
        }

        .message.success {
            background: #eaf8f0;
            color: #176b43;
        }

        .back {
            display: block;
            margin-top: 22px;
            color: #376bc0;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }

        .security-note {
            margin: 17px 0 0;
            color: #8793a5;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <header class="brand">
        <div class="logo">EJ</div>
        <h1>EXAM JUNCTION</h1>
        <p>Your learning journey starts here.</p>
    </header>

    <main class="card">
        <h2>Welcome back!</h2>

        <p class="subtitle">
            Login with your registered email and password to access your account.
        </p>

        <form id="login-form">

            <div class="field">
                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button id="login-button" type="submit">
                Login to Your Account
            </button>

            <div
                id="message"
                class="message"
                role="status"
                aria-live="polite"
            ></div>

        </form>
    </main>

    <a class="back" href="index.html">← Back to Home</a>

    <p class="security-note">
        Your account access is subject to EXAM JUNCTION's security permissions.
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>

<script>
(function () {
    "use strict";

    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message show " + type;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!window.EXAM_JUNCTION) {
            showMessage("Website system load nahi hua. Page reload karke try karein.", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "Please wait...";

        try {
            const ready = await window.EXAM_JUNCTION.init();

            if (!ready) {
                showMessage(
                    "Login abhi configure nahi hua hai. Supabase Project URL aur Publishable Key set karni baaki hai.",
                    "error"
                );
                return;
            }

            const { data, error } =
                await window.EXAM_JUNCTION.supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                showMessage(
                    "Login nahi ho saka. Email aur password check karein. Agar account nahi bana hai, pehle account registration configure karna hoga.",
                    "error"
                );
                return;
            }

            if (data.user) {
                showMessage("Login successful. Opening your account...", "success");

                window.location.replace("profile.html");
            }

        } catch (error) {
            showMessage(
                "Connection mein dikkat hai. Internet aur Supabase configuration check karein.",
                "error"
            );
        } finally {
            button.disabled = false;
            button.textContent = "Login to Your Account";
        }
    });
})();
</script>

</body>
  </html>
