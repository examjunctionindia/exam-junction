<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102b55">
    <title>Login | EXAM JUNCTION</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f7fc;
            color: #17243a;
            font-family: Arial, sans-serif;
        }

        .container { width: 100%; max-width: 410px; }

        .brand {
            margin-bottom: 25px;
            text-align: center;
        }

        .logo {
            display: grid;
            place-items: center;
            width: 62px;
            height: 62px;
            margin: 0 auto 13px;
            border-radius: 18px;
            background: #173b73;
            color: white;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0 8px 20px #173b7325;
        }

        .brand h1 {
            margin: 0;
            color: #10274c;
            font-size: 25px;
            font-weight: 900;
        }

        .brand p {
            margin: 7px 0 0;
            color: #718096;
            font-size: 13px;
        }

        .card {
            padding: 25px 21px;
            border: 1px solid #e5eaf2;
            border-radius: 22px;
            background: white;
            box-shadow: 0 12px 35px #17243a0b;
        }

        .card h2 {
            margin: 0;
            color: #10274c;
            font-size: 23px;
        }

        .subtitle {
            margin: 9px 0 22px;
            color: #718096;
            font-size: 13px;
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            padding: 5px;
            border-radius: 11px;
            background: #edf2f9;
        }

        .tab {
            flex: 1;
            min-height: 42px;
            margin: 0;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #52627a;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .tab.active {
            background: #173b73;
            color: white;
        }

        .field { margin-bottom: 17px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #263751;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 13px;
            border: 1px solid #dce3ee;
            border-radius: 11px;
            outline: none;
            background: white;
            color: #17243a;
            font-size: 15px;
        }

        input:focus {
            border-color: #376bc0;
            box-shadow: 0 0 0 3px #376bc018;
        }

        .password-box {
            position: relative;
            width: 100%;
        }

        .password-box input {
            padding-right: 76px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            min-width: 52px;
            min-height: 34px;
            padding: 6px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #376bc0;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .toggle-password:focus-visible {
            outline: 2px solid #376bc0;
            outline-offset: 2px;
        }

        .forgot-password {
            display: block;
            margin: -7px 0 17px;
            padding: 4px 0;
            border: 0;
            background: transparent;
            color: #376bc0;
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            cursor: pointer;
        }

        .text-button {
            display: block;
            margin: 12px auto 0;
            padding: 8px;
            border: 0;
            background: transparent;
            color: #376bc0;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit {
            width: 100%;
            min-height: 49px;
            margin-top: 4px;
            border: 0;
            border-radius: 12px;
            background: #173b73;
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        button:disabled {
            opacity: .65;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message.show { display: block; }
        .message.error { background: #fff0f0; color: #a12727; }
        .message.success { background: #eaf8f0; color: #176b43; }

        .back {
            display: block;
            margin-top: 22px;
            color: #376bc0;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }

        .security-note {
            margin: 17px 0 0;
            color: #8793a5;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }

        [hidden] { display: none !important; }
    </style>
</head>

<body>
<div class="container">

    <header class="brand">
        <div class="logo">EJ</div>
        <h1>EXAM JUNCTION</h1>
        <p>Your learning journey starts here.</p>
    </header>

    <main class="card">
        <h2 id="heading">Welcome back!</h2>

        <p class="subtitle" id="subtitle">
            Login with your registered email and password to access your account.
        </p>

        <div class="tabs" id="tabs">
            <button class="tab active" id="login-tab"
                    type="button" aria-pressed="true">Login</button>
            <button class="tab" id="signup-tab"
                    type="button" aria-pressed="false">Sign Up</button>
        </div>

        <div id="message" class="message"
             role="status" aria-live="polite"></div>

        <form id="auth-form">
            <div class="field" id="name-field" hidden>
                <label for="full-name">Full name</label>
                <input id="full-name" type="text"
                       autocomplete="name" maxlength="100"
                       placeholder="Enter your full name">
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email"
                       autocomplete="email" required
                       placeholder="Enter your email">
            </div>

            <div class="field" id="password-field">
                <label for="password" id="password-label">Password</label>

                <div class="password-box">
                    <input id="password" name="password" type="password"
                           autocomplete="current-password"
                           minlength="8" required
                           placeholder="At least 8 characters">

                    <button class="toggle-password"
                            type="button"
                            data-password-target="password"
                            aria-controls="password"
                            aria-label="Show password"
                            aria-pressed="false">
                        Show
                    </button>
                </div>
            </div>

            <button class="forgot-password" id="forgot-password"
                    type="button">
                Forgot Password?
            </button>

            <div class="field" id="confirm-field" hidden>
                <label for="confirm-password">Confirm password</label>

                <div class="password-box">
                    <input id="confirm-password" type="password"
                           autocomplete="new-password" minlength="8"
                           placeholder="Enter password again">

                    <button class="toggle-password"
                            type="button"
                            data-password-target="confirm-password"
                            aria-controls="confirm-password"
                            aria-label="Show confirm password"
                            aria-pressed="false">
                        Show
                    </button>
                </div>
            </div>

            <button class="submit" id="submit-button" type="submit">
                Login to Your Account
            </button>

            <button class="text-button" id="cancel-recovery"
                    type="button" hidden>
                Back to Login
            </button>
        </form>
    </main>

    <a class="back" href="index.html">← Back to Home</a>

    <p class="security-note">
        Your account access is subject to EXAM JUNCTION's security permissions.
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>

<script>
(function () {
    "use strict";

    const $ = id => document.getElementById(id);

    const form = $("auth-form");
    const loginTab = $("login-tab");
    const signupTab = $("signup-tab");
    const nameField = $("name-field");
    const confirmField = $("confirm-field");
    const fullName = $("full-name");
    const email = $("email");
    const password = $("password");
    const confirmPassword = $("confirm-password");
    const button = $("submit-button");
    const message = $("message");
    const forgotButton = $("forgot-password");
    const cancelRecoveryButton = $("cancel-recovery");

    let mode = "login";
    let busy = false;
    let recoveryReady = false;
    document.querySelectorAll(".toggle-password").forEach(toggle => {
        toggle.addEventListener("click", () => {
            const input = $(toggle.dataset.passwordTarget);
            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";
            toggle.textContent = isHidden ? "Hide" : "Show";
            toggle.setAttribute("aria-pressed", String(isHidden));
            toggle.setAttribute(
                "aria-label",
                (isHidden ? "Hide " : "Show ") +
                (input.id === "password" ? "password" : "confirm password")
            );
        });
    });

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message show " + type;
    }

    function clearMessage() {
        message.textContent = "";
        message.className = "message";
    }

    function resetPasswordVisibility() {
        document.querySelectorAll(".toggle-password").forEach(toggle => {
            const input = $(toggle.dataset.passwordTarget);
            input.type = "password";
            toggle.textContent = "Show";
            toggle.setAttribute("aria-pressed", "false");
        });
    }

    function setMode(nextMode) {
        mode = nextMode;

        const signup = mode === "signup";
        const recovery = mode === "recovery";
        const resetRequest = mode === "forgot";

        $("tabs").hidden = recovery || resetRequest;
        loginTab.classList.toggle("active", !signup);
        signupTab.classList.toggle("active", signup);

        loginTab.setAttribute("aria-pressed", String(!signup));
        signupTab.setAttribute("aria-pressed", String(signup));

        nameField.hidden = !signup;
        confirmField.hidden = !(signup || recovery);
        fullName.required = signup;
        confirmPassword.required = signup || recovery;

        $("password-field").hidden = resetRequest;
        password.required = !resetRequest;
        forgotButton.hidden = mode !== "login";
        cancelRecoveryButton.hidden = !(recovery || resetRequest);

        $("heading").textContent = recovery
            ? "Set a new password"
            : resetRequest
                ? "Reset your password"
                : signup
                    ? "Create your account"
                    : "Welcome back!";

        $("subtitle").textContent = recovery
            ? "Create a new password for your EXAM JUNCTION account."
            : resetRequest
                ? "Enter your registered email address. We will send a password reset link if the account is eligible."
                : signup
                    ? "Register to start your EXAM JUNCTION learning journey."
                    : "Login with your registered email and password to access your account.";

        $("password-label").textContent = recovery
            ? "New password"
            : "Password";

        password.placeholder = recovery
            ? "Enter a new password"
            : "At least 8 characters";

        button.textContent = recovery
            ? "Update Password"
            : resetRequest
                ? "Send Reset Link"
                : signup
                    ? "Create Account"
                    : "Login to Your Account";

        password.autocomplete = signup || recovery
            ? "new-password"
            : "current-password";

        resetPasswordVisibility();
        clearMessage();
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    forgotButton.addEventListener("click", () => {
        setMode("forgot");
        email.focus();
    });

    cancelRecoveryButton.addEventListener("click", () => {
        recoveryReady = false;
        setMode("login");
    });

    function getSafeNextUrl() {
        const requested = new URLSearchParams(window.location.search).get("next");
        if (!requested) return "profile.html";
        try {
            const target = new URL(requested, window.location.href);
            if (target.origin !== window.location.origin || !target.pathname.endsWith(".html")) return "profile.html";
            return target.pathname.split("/").pop() + target.search + target.hash;
        } catch (_) { return "profile.html"; }
    }

    async function getClient() {
        if (!window.EXAM_JUNCTION) {
            throw new Error("Website system load nahi hua. Page reload karein.");
        }

        const ready = await window.EXAM_JUNCTION.init();

        if (!ready || !window.EXAM_JUNCTION.supabase) {
            throw new Error(
                "Supabase load nahi hua. Configuration aur internet check karein."
            );
        }

        return window.EXAM_JUNCTION.supabase;
    }

    /*
     * Supabase sends PASSWORD_RECOVERY when the user opens a valid
     * password-reset link. Then show the new-password form.
     */
    async function initializeRecovery() {
        // Capture the recovery marker before Supabase processes the URL hash.
        // Supabase may consume/remove the hash before this page subscribes to auth events.
        const initialHash = window.location.hash || "";
        const recoveryLinkPresent =
            /(?:^|[&#])type=recovery(?:&|$)/i.test(initialHash) ||
            /(?:^|[&#])access_token=[^&]+/i.test(initialHash) &&
            /(?:^|[&#])type=recovery(?:&|$)/i.test(initialHash);

        try {
            const client = await getClient();

            client.auth.onAuthStateChange((event) => {
                if (event === "PASSWORD_RECOVERY") {
                    recoveryReady = true;
                    setMode("recovery");
                    showMessage(
                        "Reset link verify ho gaya. Ab naya password set karein.",
                        "success"
                    );
                }
            });

            const { data, error } = await client.auth.getSession();
            if (error) throw error;

            // Use the captured URL marker, not the possibly-cleared current hash.
            if (recoveryLinkPresent && data.session) {
                recoveryReady = true;
                setMode("recovery");
                showMessage(
                    "Reset link verify ho gaya. Ab naya password set karein.",
                    "success"
                );
            } else if (recoveryLinkPresent && !data.session) {
                showMessage(
                    "Reset link verify nahi ho saka ya expire ho gaya. Forgot Password se naya link mangwayein.",
                    "error"
                );
            }
        } catch (error) {
            console.error("Recovery initialization error:", error);
        }
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();

        if (busy) return;
        clearMessage();

        const userEmail = email.value.trim();
        const userPassword = password.value;

        if ((mode === "signup" || mode === "recovery") &&
            userPassword.length < 8) {
            showMessage(
                "Password kam se kam 8 characters ka hona chahiye.",
                "error"
            );
            return;
        }

        if (mode === "signup" && fullName.value.trim().length < 2) {
            showMessage("Apna poora naam likhein.", "error");
            return;
        }

        if (mode === "signup" || mode === "recovery") {
            if (userPassword !== confirmPassword.value) {
                showMessage("Dono passwords match nahi karte.", "error");
                return;
            }
        }

        if ((mode === "login" || mode === "forgot") && !userEmail) {
            showMessage("Apna registered email address likhein.", "error");
            return;
        }

        busy = true;
        button.disabled = true;

        const originalMode = mode;
        button.textContent = "Please wait...";

        try {
            const client = await getClient();

            if (mode === "forgot") {
                const redirectTo = window.location.origin +
                    window.location.pathname.replace(/[^/]*$/, "login.html");

                const { error } = await client.auth.resetPasswordForEmail(
                    userEmail,
                    { redirectTo }
                );

                if (error) throw error;

                showMessage(
                    "Agar is email par account hai, password reset link bhej diya gaya hai. Inbox aur Spam folder check karein.",
                    "success"
                );
            } else if (mode === "recovery") {
                if (!recoveryReady) {
                    throw new Error(
                        "Reset link se page kholna zaroori hai. Email ka naya reset link use karein."
                    );
                }

                const { error } = await client.auth.updateUser({
                    password: userPassword
                });

                if (error) throw error;

                recoveryReady = false;

                await client.auth.signOut();

                password.value = "";
                confirmPassword.value = "";
                setMode("login");

                showMessage(
                    "Password successfully change ho gaya! Ab naye password se Login karein.",
                    "success"
                );
            } else if (mode === "signup") {
                const { data, error } = await client.auth.signUp({
                    email: userEmail,
                    password: userPassword,
                    options: {
                        data: { full_name: fullName.value.trim() },
                        emailRedirectTo: window.location.origin +
                            window.location.pathname.replace(
                                /[^/]*$/, "login.html"
                            ),
                    }
                });

                if (error) throw error;

                if (data.session) {
                    showMessage(
                        "Account ban gaya! Profile khol rahe hain.",
                        "success"
                    );

                    window.setTimeout(() => {
                        window.location.replace(getSafeNextUrl());
                    }, 900);
                } else {
                    showMessage(
                        "Signup request ho gayi. Agar email confirmation enabled hai, inbox mein verification link check karein. Verify hone ke baad Login karein.",
                        "success"
                    );
                }
            } else {
                const { data, error } =
                    await client.auth.signInWithPassword({
                        email: userEmail,
                        password: userPassword,
                    });

                if (error) throw error;

                if (!data.user) {
                    throw new Error("Login complete nahi hua. Dobara try karein.");
                }

                showMessage(
                    "Login successful. Profile khol rahe hain...",
                    "success"
                );

                window.setTimeout(() => {
                    window.location.replace(getSafeNextUrl());
                }, 500);
            }
        } catch (error) {
            console.error("EXAM JUNCTION authentication error:", error);

            showMessage(
                error.message || "Kuchh galat hua. Dobara try karein.",
                "error"
            );
        } finally {
            busy = false;
            button.disabled = false;

            if (mode === originalMode) {
                button.textContent =
                    mode === "recovery"
                        ? "Update Password"
                        : mode === "forgot"
                            ? "Send Reset Link"
                            : mode === "signup"
                                ? "Create Account"
                                : "Login to Your Account";
            }
        }
    });

    initializeRecovery();
})();
</script>
</body>
</html>
