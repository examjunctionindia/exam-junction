<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script>
(async()=>{
"use strict";
const $=id=>document.getElementById(id);
const status=$("status"),content=$("content");
const clientReady=await window.EXAM_JUNCTION.init();
if(!clientReady){status.textContent="Connection unavailable. Internet check karke refresh karein.";return}
const db=window.EXAM_JUNCTION.supabase;
const id=new URLSearchParams(location.search).get("id");
if(!id){status.textContent="Batch ID nahi mila. Home se batch open karein.";return}
$("batchNotificationsLink").href="notifications.html?batch_id="+encodeURIComponent(id);
const safeUrl=value=>{try{const u=new URL(String(value||""));return u.protocol==="https:"&&u.hostname&&!["localhost","127.0.0.1"].includes(u.hostname.toLowerCase())?u.href:null}catch(_){return null}};
const getDownloadAllowed=item=>{
  const mode=item.download_permission_mode||(item.download_allowed===true?"allow":"inherit");
  if(mode==="allow")return true;
  if(mode==="deny")return false;
  return batch.default_download_allowed===true;
};
const canShowOriginal=item=>batch.access_type!=="restricted" || (batch.restricted_original_link_allowed===true && item.original_link_allowed===true);
function googlePdfUrls(raw){
  let view=safeUrl(raw),original=view,download=view;
  if(!view)return {view:null,original:null,download:null};
  try{
    const u=new URL(view);
    if(u.hostname==="drive.google.com"){
      let m=u.pathname.match(/\/file\/d\/([^/]+)/);
      if(!m&&u.pathname==="/open"&&u.searchParams.get("id"))m=[null,u.searchParams.get("id")];
      if(m&&m[1]){view="https://drive.google.com/file/d/"+encodeURIComponent(m[1])+"/preview";original="https://drive.google.com/file/d/"+encodeURIComponent(m[1])+"/view";download="https://drive.google.com/uc?export=download&id="+encodeURIComponent(m[1]);}
    }else if(u.hostname==="docs.google.com"){
      original=u.origin+u.pathname.replace(/\/edit.*$/,"/edit");
      view=u.origin+u.pathname.replace(/\/edit.*$/,"/preview");
      download=u.origin+u.pathname.replace(/\/edit.*$/,"/export?format=pdf");
    }
  }catch(_){}
  return {view,original,download};
}
async function resolveNoteUrl(note,{download=false,original=false}={}){
  if(note.storage_bucket==="ej-private-content"&&note.storage_path){
    const options=download?{download:(note.title||"notes")+".pdf"}:undefined;
    const {data,error}=await db.storage.from("ej-private-content").createSignedUrl(note.storage_path,300,options);
    if(error||!data?.signedUrl)throw error||new Error("Secure PDF link nahi mila.");
    return data.signedUrl;
  }
  const raw=safeUrl(note.storage_path||"");
  if(!raw)throw new Error("Valid HTTPS PDF link available nahi hai.");
  const urls=googlePdfUrls(raw);
  if(download)return safeUrl(note.download_url||"")||urls.download||raw;
  return original?(urls.original||raw):(urls.view||raw);
}
function makeNoteRow(note){
  const row=document.createElement("div");row.className="note";row.dataset.noteId=note.id;row.dataset.noteSearch=(note.title||"").toLowerCase();
  const title=document.createElement("div");title.style.fontWeight="700";title.textContent=note.title||"Notes";row.append(title);
  const isPrivate=note.storage_bucket==="ej-private-content"&&!!note.storage_path;
  const raw=safeUrl(note.storage_path||"");
  if(!isPrivate&&!raw){const p=document.createElement("p");p.className="muted";p.textContent="PDF link available nahi hai. Admin se contact karein.";row.append(p);return row}
  const actions=document.createElement("div");actions.className="media-actions";
  const view=document.createElement("button");view.className="btn";view.type="button";view.textContent="📖 View PDF";actions.append(view);
  const wrap=document.createElement("div");wrap.className="pdf-fullscreen hidden";
  const frame=document.createElement("iframe");frame.className="pdf";frame.title=note.title||"Notes PDF";frame.loading="lazy";frame.allow="fullscreen";wrap.append(frame);
  // Keep recovery actions available: cross-origin PDF viewers can fire iframe load on provider error pages.
  const fallback=document.createElement("div");fallback.className="fallback-box";fallback.append(document.createTextNode("PDF nahi khul raha? Retry karein ya allowed original link kholein. "));
  const retry=document.createElement("button");retry.className="btn";retry.type="button";retry.textContent="↻ Retry";
  retry.addEventListener("click",async()=>{try{frame.src=await resolveNoteUrl(note)}catch(e){console.error("PDF retry error",e)}});
  fallback.append(retry);
  if(canShowOriginal(note)){
    const original=document.createElement("button");original.className="btn";original.type="button";original.textContent="↗ Open Original Link";
    original.addEventListener("click",async()=>{try{const url=await resolveNoteUrl(note,{original:true});window.open(url,"_blank","noopener,noreferrer")}catch(e){alert("Original link available nahi hai.");console.error("Original notes link error",e)}});
    fallback.append(original);
  }
  wrap.append(fallback);
  view.addEventListener("click",async()=>{wrap.classList.remove("hidden");wrap.scrollIntoView({behavior:"smooth",block:"nearest"});try{frame.src=await resolveNoteUrl(note)}catch(e){console.error("PDF open error",e)}});
  const downloadAllowed=getDownloadAllowed(note);
  if(downloadAllowed&&(note.download_url||isPrivate||raw)){
    const dl=document.createElement("button");dl.className="btn";dl.type="button";dl.textContent="⬇ Download";
    dl.addEventListener("click",async()=>{try{const url=await resolveNoteUrl(note,{download:true});window.open(url,"_blank","noopener,noreferrer")}catch(e){alert("Download available nahi hai.");console.error("Notes download error",e)}});
    actions.append(dl);
  }
  row.append(actions,wrap);return row;
}
const [batchResult,userResult]=await Promise.all([
  db.from("batches").select("id,title,description,show_description,platform_name,access_type,is_published,thumbnail_url,show_content_counts,chapter_search_enabled,announcement_search_enabled,default_download_allowed,restricted_original_link_allowed,published_at").eq("id",id).eq("is_published",true).maybeSingle(),
  db.auth.getUser()
]);
if(batchResult.error){status.textContent="Batch load nahi ho paya. Dobara refresh karein.";console.error("Batch load error",batchResult.error);return}
const batch=batchResult.data;
if(!batch){status.textContent="Batch nahi mila ya abhi publish nahi hai.";return}
$("title").textContent=batch.title||"Maths Batch";
$("description").textContent=batch.description||"";
$("description").hidden=!(batch.show_description===true&&batch.description);
$("meta").textContent=(batch.platform_name?"Teacher: "+batch.platform_name+" • ":"")+(batch.access_type==="free"?"Free batch":"Selected students only");
const thumbnail=safeUrl(batch.thumbnail_url||"");if(thumbnail){$("batchThumbnail").src=thumbnail;$("batchThumbnail").alt=(batch.title||"Batch")+" thumbnail";$("batchThumbnail").classList.remove("hidden");$("batchThumbnail").onerror=()=>{$("batchThumbnail").classList.add("hidden")}}
content.classList.remove("hidden");status.classList.add("hidden");
const user=userResult?.data?.user||null;
let allowed=batch.access_type==="free";
if(batch.access_type==="restricted"&&user){
 const {data:grant,error}=await db.from("batch_access").select("id").eq("batch_id",id).eq("student_id",user.id).maybeSingle();
 if(error)console.warn("Access check failed",error);allowed=!!grant;
}
if(!allowed){
 const panel=$("access-panel");panel.classList.remove("hidden");
 panel.innerHTML='<h2>🔒 Access required</h2><p class="muted">'+(user?'Is batch ke liye access request bhejein. Admin approve karega.':'Restricted batch ke liye login karke request bhejna zaroori hai.')+'</p>'+(user?'<label for="requestReason">Request reason (optional)</label><textarea id="requestReason" maxlength="300" rows="3" placeholder="Agar chahein to chhota sa reason likhein"></textarea>':'')+'<button class="btn" id="request">'+(user?'Request Access':'Login to Access')+'</button>';
 $("request").onclick=async()=>{
  if(!user){location.href="login.html?next="+encodeURIComponent("batch-detail.html?id="+id);return}
  const button=$("request");button.disabled=true;
  try{
   const {data:existing,error:ee}=await db.from("batch_join_requests").select("id,status").eq("batch_id",id).eq("student_id",user.id).maybeSingle();
   if(ee)throw ee;
   const reason=String($("requestReason")?.value||"").trim().slice(0,300);
   if(existing){
    if(existing.status==="pending"){alert("Aapki request pehle se pending hai. Admin approval ka wait karein.");button.textContent="Request Pending";return}
    const {data:grant,error:grantError}=await db.from("batch_access").select("id").eq("batch_id",id).eq("student_id",user.id).maybeSingle();
    if(grantError)throw grantError;
    if(grant){alert("Aapko is batch ka access pehle se mila hua hai.");button.textContent="Access Granted";return}
    const {error:updateError}=await db.from("batch_join_requests").update({status:"pending",request_reason:reason||null,created_at:new Date().toISOString()}).eq("id",existing.id).eq("status",existing.status);
    if(updateError)throw updateError;
   }else{
    const {error:insertError}=await db.from("batch_join_requests").insert({batch_id:id,student_id:user.id,status:"pending",request_reason:reason||null});
    if(insertError)throw insertError;
   }
   alert(existing?"Access revoke ho chuka tha. Nayi request bhej di gayi; admin approval ka wait karein.":"Request bhej di gayi. Admin approval ka wait karein.");button.textContent="Request Pending";
  }catch(error){alert("Request nahi bhej paaye. Internet ya permission check karke retry karein.");console.error("Batch request failed",error);button.disabled=false}
 };
 return;
}
const dotQuery=db.from("notifications").select("id,published_at,created_at,expires_at").eq("batch_id",id).eq("is_published",true).order("published_at",{ascending:false}).limit(100);
if(user)dotQuery.or("recipient_id.is.null,recipient_id.eq."+user.id);else dotQuery.is("recipient_id",null);
const {data:dotRows,error:dotError}=await dotQuery;
if(dotError)console.warn("Batch notification indicator unavailable",dotError);
const activeDotRows=(dotRows||[]).filter(n=>!n.expires_at||Date.parse(n.expires_at)>Date.now());
const icon=$("batchNotificationsLink");
const dot=$("batchNotificationDot");
icon.classList.remove("is-new","is-old","is-empty");
dot.classList.remove("is-new","is-old","is-empty");
if(activeDotRows.length){
 const cutoff=Date.now()-24*60*60*1000;
 const hasNew=activeDotRows.some(n=>{const t=Date.parse(n.published_at||n.created_at||"");return Number.isFinite(t)&&t>=cutoff});
 const state=hasNew?"is-new":"is-old";
 icon.classList.add(state);
 icon.title=hasNew?"New batch notifications":"Older batch notifications";
 icon.setAttribute("aria-label",hasNew?"New batch notifications":"Older batch notifications");
}else{
 icon.classList.add("is-empty");
 icon.title="No batch notifications";
 icon.setAttribute("aria-label","No batch notifications");
}
dot.hidden=true;
const chaptersRoot=$("chapters");
/* Batch announcements are shown only in this batch's Notifications page,
   opened from the bell above; do not duplicate them on the batch details page. */
const chapterSearch=batch.chapter_search_enabled===true?document.createElement("input"):null;
if(chapterSearch){chapterSearch.type="search";chapterSearch.className="simple-search";chapterSearch.placeholder="Search chapters or lectures";chapterSearch.setAttribute("aria-label","Search chapters or lectures");chaptersRoot.before(chapterSearch)}
const chapterResult=await db.from("chapters").select("id,title,position,created_at,is_published").eq("batch_id",id).eq("is_published",true).order("position",{ascending:true}).order("created_at",{ascending:true}).order("id",{ascending:true});
if(chapterResult.error){const p=document.createElement("p");p.className="notice";p.textContent="Chapters load nahi ho paaye. Dobara refresh karein.";chaptersRoot.append(p);console.error(chapterResult.error);return}
const chapters=chapterResult.data||[];
// Show actual published counts only after the batch access check above has succeeded.
if(batch.show_content_counts===true){
 let lectureCount=0,countAvailable=true;
 if(chapters.length){
  const {count:countRows,error:countError}=await db.from("lectures").select("id",{count:"exact",head:true}).in("chapter_id",chapters.map(ch=>ch.id)).eq("is_published",true);
  if(countError){countAvailable=false;console.warn("Published lecture count unavailable",countError);}
  else lectureCount=Number(countRows||0);
 }
 if(countAvailable){
  const countText=document.createElement("span");countText.className="batch-content-counts";
  countText.textContent=" · "+chapters.length+" Chapters · "+lectureCount+" Lectures";
  $("meta").append(countText);
 }
}
if(!chapters.length){const p=document.createElement("p");p.className="notice";p.textContent="Abhi published chapters available nahi hain.";chaptersRoot.append(p);return}
const allLectures=[];
for(let chapterIndex=0;chapterIndex<chapters.length;chapterIndex++){
 const chapter=chapters[chapterIndex];
 const chapterNumber=String(chapterIndex+1).padStart(2,"0");const section=document.createElement("details");section.className="chapter";section.dataset.chapterSearch=("chapter "+chapterNumber+" "+(chapter.title||"")).toLowerCase();section.open=chapterIndex===0;
 const heading=document.createElement("summary");heading.textContent=chapter.title||"Chapter";section.append(heading);
 const inner=document.createElement("div");inner.className="chapter-inner";section.append(inner);chaptersRoot.append(section);
 const [lr,nr]=await Promise.all([
  db.from("lectures").select("id,chapter_id,title,youtube_url,position,teacher_name,download_url,download_allowed,download_permission_mode,original_link_allowed,is_published,published_at,created_at").eq("chapter_id",chapter.id).eq("is_published",true).order("position",{ascending:true}).order("created_at",{ascending:true}).order("id",{ascending:true}),
  db.from("chapter_notes").select("id,chapter_id,lecture_id,title,storage_path,storage_bucket,download_url,download_allowed,download_permission_mode,original_link_allowed,position,is_published,created_at").eq("chapter_id",chapter.id).eq("is_published",true).order("position",{ascending:true}).order("created_at",{ascending:true})
 ]);
 if(lr.error||nr.error){const p=document.createElement("p");p.className="muted";p.textContent="Is chapter ka content load nahi ho paya.";inner.append(p);console.error(lr.error||nr.error);continue}
 const lectures=lr.data||[],notes=nr.data||[];
 const chapterNotes=notes.filter(n=>!n.lecture_id);
 heading.textContent="Chapter "+chapterNumber+" — "+(chapter.title||"Chapter")+(chapterNotes.length?" · Notes available":"")+(batch.show_content_counts===true?" ("+lectures.length+" lectures)":"");
 if(!lectures.length){const p=document.createElement("p");p.className="muted";p.textContent="Abhi published lectures available nahi hain.";inner.append(p)}
 for(let lectureIndex=0;lectureIndex<lectures.length;lectureIndex++){
  const lecture=lectures[lectureIndex];const lectureNumber=String(lectureIndex+1).padStart(2,"0");
  const row=document.createElement("details");row.className="lecture lesson lecture-accordion";row.dataset.lectureId=lecture.id;row.dataset.chapterId=chapter.id;row.dataset.lectureSearch=("lecture "+lectureNumber+" "+(lecture.title||"Lecture")).toLowerCase();
  const h=document.createElement("summary");h.className="lesson-title";h.textContent="Lecture "+lectureNumber+" — "+(lecture.title||"Lecture");row.append(h);
  const body=document.createElement("div");body.className="lecture-content";row.append(body);
  const raw=safeUrl(lecture.youtube_url||"");
  let embedSrc=null,directVideo=false;
  if(raw){
   const u=new URL(raw);let m=u.href.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
   if(m)embedSrc="https://www.youtube-nocookie.com/embed/"+m[1]+"?controls=1&playsinline=1&rel=0";
   else if(u.hostname==="drive.google.com"){let g=u.pathname.match(/\/file\/d\/([^/]+)/);if(!g&&u.pathname==="/open"&&u.searchParams.get("id"))g=[null,u.searchParams.get("id")];if(g&&g[1])embedSrc="https://drive.google.com/file/d/"+encodeURIComponent(g[1])+"/preview"}
   else if(u.hostname==="vimeo.com"||u.hostname==="www.vimeo.com"){const vm=u.pathname.match(/\/(\d+)(?:$|\/)/);if(vm)embedSrc="https://player.vimeo.com/video/"+vm[1]}
   else if(/\.(mp4|webm|ogg)$/i.test(u.pathname))directVideo=true;
  }
  const originalAllowed=canShowOriginal(lecture);
  const actions=document.createElement("div");actions.className="media-actions";
  let wrap=null,player=null,fallback=null,timer=null,alternateFrame=null;
  if(embedSrc||directVideo){
   wrap=document.createElement("div");wrap.className="media-fullscreen hidden";
   const loading=document.createElement("p");loading.className="muted media-loading";loading.textContent="Video load ho raha hai...";wrap.append(loading);
   if(directVideo){player=document.createElement("video");player.className="viewer";player.controls=true;player.playsInline=true;player.preload="metadata";player.referrerPolicy="no-referrer";player.src=raw;player.style.height="auto";player.style.maxHeight="70vh"}
   else{player=document.createElement("iframe");player.className="viewer";player.src=embedSrc;player.title=lecture.title||"Lecture";player.loading="lazy";player.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";player.allowFullscreen=true;player.referrerPolicy="strict-origin-when-cross-origin";player.addEventListener("load",()=>{loading.classList.add("hidden")})}
   wrap.append(player);
   fallback=document.createElement("div");fallback.className="fallback-box hidden";fallback.textContent="Video play nahi ho pa raha hai. Kripya kuch der baad dobara koshish karein.";
   function showPlaybackError(){if(timer){clearTimeout(timer);timer=null}loading.classList.add("hidden");fallback.classList.remove("hidden");if(alternateFrame)alternateFrame.style.display="";if(player&&player.isConnected)player.remove()}
   function tryAlternatePlayer(){
    if(!directVideo||alternateFrame){showPlaybackError();return}
    if(timer){clearTimeout(timer);timer=null}
    loading.classList.remove("hidden");
    if(player&&player.isConnected)player.remove();
    alternateFrame=document.createElement("iframe");alternateFrame.className="viewer";alternateFrame.title=lecture.title||"Lecture";alternateFrame.allow="fullscreen";alternateFrame.allowFullscreen=true;alternateFrame.referrerPolicy="no-referrer";alternateFrame.style.height="auto";alternateFrame.style.maxHeight="70vh";
    alternateFrame.src=raw;
    wrap.insertBefore(alternateFrame,fallback);
    timer=setTimeout(showPlaybackError,5000);
    alternateFrame.addEventListener("load",()=>{if(timer){clearTimeout(timer);timer=null}loading.classList.add("hidden");fallback.classList.add("hidden")});
   }
   wrap.append(fallback);body.append(wrap);
   if(directVideo){
    const startLoadTimeout=()=>{
     if(timer)clearTimeout(timer);
     timer=setTimeout(tryAlternatePlayer,5000);
    };
    player.addEventListener("loadstart",()=>{loading.classList.remove("hidden");startLoadTimeout()});
    player.addEventListener("waiting",()=>{loading.classList.remove("hidden");startLoadTimeout()});
    player.addEventListener("error",tryAlternatePlayer);
    player.addEventListener("stalled",startLoadTimeout);
    player.addEventListener("abort",tryAlternatePlayer);
    player.addEventListener("canplay",()=>{
     if(timer){clearTimeout(timer);timer=null}
     loading.classList.add("hidden");
     fallback.classList.add("hidden");
     player.style.display="";
    });
    player.addEventListener("playing",()=>{
     if(timer){clearTimeout(timer);timer=null}
     loading.classList.add("hidden");
     fallback.classList.add("hidden");
    });
   }
   
   const watch=document.createElement("button");watch.className="btn";watch.type="button";watch.textContent="▶ Watch";watch.addEventListener("click",async()=>{wrap.classList.remove("hidden");if(directVideo&&!player.readyState){startLoadTimeout()}try{await wrap.requestFullscreen()}catch(_){wrap.scrollIntoView({behavior:"smooth",block:"nearest"})}});actions.append(watch);
   const full=document.createElement("button");full.className="btn";full.type="button";full.textContent="⛶ Fullscreen";full.addEventListener("click",async()=>{wrap.classList.remove("hidden");try{if(document.fullscreenElement){await document.exitFullscreen();return}if(directVideo&&player&&typeof player.webkitEnterFullscreen==="function"){player.webkitEnterFullscreen();return}if(player&&typeof player.requestFullscreen==="function"){await player.requestFullscreen()}else if(typeof wrap.requestFullscreen==="function"){await wrap.requestFullscreen()}else throw new Error("Fullscreen unsupported");if(screen.orientation&&typeof screen.orientation.lock==="function"){try{await screen.orientation.lock("landscape")}catch(_){}}}catch(error){console.warn("Fullscreen request failed",error);wrap.scrollIntoView({behavior:"smooth",block:"nearest"})}});actions.append(full);
  }else{
   const message=document.createElement("p");message.className="muted";message.textContent="Is video source ko website ke player mein nahi khola ja sakta.";body.append(message);
   if(originalAllowed&&raw){const open=document.createElement("a");open.className="btn";open.href=raw;open.target="_blank";open.rel="noopener noreferrer";open.textContent="▶ Watch / Open Original Link";actions.append(open)}
  }
  const lectureDownloadUrl=safeUrl(lecture.download_url)||(directVideo?raw:null);if(getDownloadAllowed(lecture)&&lectureDownloadUrl){const dl=document.createElement("a");dl.className="btn";dl.href=lectureDownloadUrl;dl.target="_blank";dl.rel="noopener noreferrer";dl.textContent="⬇ Download";actions.append(dl)}
  if(actions.childElementCount)body.append(actions);
  if(lecture.teacher_name){const teacher=document.createElement("p");teacher.className="muted";teacher.textContent="Teacher: "+lecture.teacher_name;body.append(teacher)}
  const lectureNotes=notes.filter(n=>n.lecture_id===lecture.id);
  if(lectureNotes.length){const ln=document.createElement("div");ln.className="chapter-notes";const lh=document.createElement("h4");lh.textContent="Lecture Notes";ln.append(lh);lectureNotes.forEach(n=>ln.append(makeNoteRow(n)));body.append(ln)}
  inner.append(row);allLectures.push({row,chapterSection:section,chapterId:chapter.id,chapterTitle:chapter.title||"Chapter",title:lecture.title||"Lecture"});
 }
 if(chapterNotes.length){const noteBox=document.createElement("div");noteBox.className="chapter-notes";const nh=document.createElement("h3");nh.textContent="Chapter Notes";noteBox.append(nh);chapterNotes.forEach(n=>noteBox.append(makeNoteRow(n)));inner.append(noteBox)}
}
function focusLecture(index){
 const target=allLectures[index];if(!target)return;
 allLectures.forEach((item,i)=>{if(i!==index)item.row.open=false});
 target.chapterSection.open=true;target.row.open=true;target.row.scrollIntoView({behavior:"smooth",block:"start"});
}
allLectures.forEach((item,index)=>{
 const nav=document.createElement("div");nav.className="media-actions";
 if(index>0){const prev=document.createElement("button");prev.className="btn";prev.type="button";prev.textContent="← Previous Lecture";prev.addEventListener("click",()=>focusLecture(index-1));nav.append(prev)}
 if(index<allLectures.length-1){const next=document.createElement("button");next.className="btn";next.type="button";next.textContent=allLectures[index+1].chapterId!==item.chapterId?"Next Chapter →":"Next Lecture →";next.addEventListener("click",()=>focusLecture(index+1));nav.append(next)}
 if(nav.childElementCount)item.row.querySelector(".lecture-content").append(nav);
});
if(chapterSearch)chapterSearch.addEventListener("input",()=>{const q=chapterSearch.value.trim().toLowerCase();Array.from(chaptersRoot.querySelectorAll(":scope > .chapter")).forEach(section=>{const chapterMatch=!q||section.dataset.chapterSearch.includes(q);const chapterNoteBox=section.querySelector(":scope > .chapter-inner > .chapter-notes");const chapterNoteMatch=!!chapterNoteBox&&Array.from(chapterNoteBox.querySelectorAll("[data-note-search]")).some(note=>note.dataset.noteSearch.includes(q));const lectureRows=Array.from(section.querySelectorAll(".lecture-accordion"));const matchingLectures=lectureRows.filter(row=>!q||row.dataset.lectureSearch.includes(q)||Array.from(row.querySelectorAll("[data-note-search]")).some(note=>note.dataset.noteSearch.includes(q)));section.hidden=!!q&&!chapterMatch&&!chapterNoteMatch&&matchingLectures.length===0;lectureRows.forEach(row=>{const lectureMatch=!q||chapterMatch||row.dataset.lectureSearch.includes(q)||Array.from(row.querySelectorAll("[data-note-search]")).some(note=>note.dataset.noteSearch.includes(q));row.hidden=!lectureMatch});if(chapterNoteBox)chapterNoteBox.hidden=!!q&&!chapterMatch&&!chapterNoteMatch})});
})();
</script>
</body></html>
