<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b55"><title>Batch | EXAM JUNCTION</title><link rel="stylesheet" href="assets/css/style.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17243a;font-family:Arial,sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;padding-bottom:35px}header{padding:16px;background:white;border-bottom:1px solid #e6ebf2;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;color:#173b73;text-decoration:none}.back{padding:10px 12px;border:1px solid #e6ebf2;border-radius:10px;background:white}main{padding:20px 16px}h1,h2,h3{color:#10274c}.muted{color:#718096;line-height:1.65;font-size:14px}.panel,.chapter,.notice{background:white;border:1px solid #e6ebf2;border-radius:15px;padding:16px;margin:14px 0}.btn{display:inline-block;border:0;border-radius:10px;padding:12px 15px;background:#173b73;color:white;font-weight:bold;text-decoration:none;cursor:pointer}.lecture,.note{padding:12px 0;border-top:1px solid #edf0f5}.viewer{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#101b35}.pdf{width:100%;height:70vh;border:0;background:#eee}.hidden{display:none!important}
</style></head><body><div class="app"><header><a class="brand" href="index.html">← EXAM JUNCTION</a><a href="login.html">Login</a></header><main><div id="status" class="notice">Batch load ho raha hai…</div><section id="content" class="hidden"><div class="panel"><h1 id="title"></h1><p id="description" class="muted"></p><div id="meta" class="muted"></div></div><div id="access-panel" class="panel hidden"></div><div id="chapters"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),status=$("status"),content=$("content"),clientReady=await window.EXAM_JUNCTION.init();if(!clientReady){status.textContent="Connection unavailable. Internet check karke refresh karein.";return}const db=window.EXAM_JUNCTION.supabase,escape=window.EXAM_JUNCTION.escapeHTML,id=new URLSearchParams(location.search).get("id");if(!id){status.textContent="Batch ID nahi mila. Home se batch open karein.";return}
try{const [{data:batch,error:be},{data:userData}]=await Promise.all([db.from("batches").select("id,title,description,platform_name,access_type,is_published").eq("id",id).eq("is_published",true).maybeSingle(),db.auth.getUser()]);if(be)throw be;if(!batch){status.textContent="Batch nahi mila ya abhi publish nahi hai.";return}
$("title").textContent=batch.title||"Maths Batch";$("description").textContent=batch.description||"Batch ke chapters aur learning content."; $("meta").textContent=(batch.platform_name?"Teacher: "+batch.platform_name+" • ":"")+(batch.access_type==="free"?"Free batch":"Selected students only");content.classList.remove("hidden");status.classList.add("hidden");
let allowed=batch.access_type==="free",user=userData?.user||null;
if(batch.access_type==="restricted"&&user){const {data:grant,error}=await db.from("batch_access").select("id").eq("batch_id",id).eq("student_id",user.id).maybeSingle();if(error)console.warn(error);allowed=!!grant}
if(!allowed){const panel=$("access-panel");panel.classList.remove("hidden");panel.innerHTML='<h2>🔒 Access required</h2><p class="muted">'+(user?'Is batch ke liye access request bhejein. Admin approve karega.':'Restricted batch ke liye login karke request bhejna zaroori hai.')+'</p><button class="btn" id="request">'+(user?'Request Access':'Login to Continue')+'</button>'; $("request").onclick=async()=>{if(!user){location.href="login.html?next="+encodeURIComponent("batch.html?id="+id);return}const {data:existing,error:ee}=await db.from("batch_join_requests").select("id,status").eq("batch_id",id).eq("student_id",user.id).maybeSingle();if(ee){alert("Request status check nahi ho saka.");return}if(existing){alert("Aapki request status: "+existing.status);return}const {error}=await db.from("batch_join_requests").insert({batch_id:id,student_id:user.id,status:"pending"});if(error){alert("Request nahi bhej paaye: "+error.message);return}alert("Request bhej di gayi. Admin approval ka wait karein.");$("request").textContent="Request sent";$("request").disabled=true};return}
const ch=$("chapters");const {data:chapters,error:ce}=await db.from("chapters").select("id,title,position").eq("batch_id",id).order("position",{ascending:true});if(ce)throw ce;if(!chapters?.length){ch.innerHTML='<div class="notice">Abhi chapters add nahi hue hain.</div>';return}
for(const chapter of chapters){const section=document.createElement("section");section.className="chapter";const heading=document.createElement("h2");heading.textContent=chapter.title||"Chapter";section.append(heading);const [lr,nr]=await Promise.all([db.from("lectures").select("id,title,youtube_url,position").eq("chapter_id",chapter.id).order("position",{ascending:true}),db.from("chapter_notes").select("id,title,storage_path,created_at").eq("chapter_id",chapter.id).order("created_at",{ascending:false})]);if(lr.error)throw lr.error;if(nr.error)throw nr.error;
for(const lecture of (lr.data||[])){const row=document.createElement("div");row.className="lecture";const h=document.createElement("h3");h.textContent=lecture.title||"Lecture";row.append(h);const videoId=(lecture.youtube_url||"").match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);if(videoId){const frame=document.createElement("iframe");frame.className="viewer";frame.src="https://www.youtube-nocookie.com/embed/"+videoId[1];frame.title=lecture.title||"Lecture";frame.loading="lazy";frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";frame.allowFullscreen=true;row.append(frame)}else{const p=document.createElement("p");p.className="muted";p.textContent="Valid YouTube URL nahi mila.";row.append(p)}section.append(row)}
for(const note of (nr.data||[])){const row=document.createElement("div");row.className="note";const h=document.createElement("h3");h.textContent=note.title||"Chapter Notes";row.append(h);const path=note.storage_path||"";let url=path;if(!/^https?:\/\//i.test(path)){const {data:obj}=await db.storage.from("study-materials").createSignedUrl(path,300);url=obj?.signedUrl||""}else if(path.includes("drive.google.com/file/d/")){url=path.replace(/\/view(?:\?.*)?$/,"/preview")}if(url){const frame=document.createElement("iframe");frame.className="pdf";frame.src=url;frame.title=note.title||"Notes";frame.loading="lazy";row.append(frame)}else{const p=document.createElement("p");p.className="muted";p.textContent="Notes preview nahi ho paaya. Admin se storage bucket/path check karwayein.";row.append(p)}section.append(row)}
ch.append(section)}
}catch(e){console.error(e);status.textContent="Content load nahi hua. Database connection ya access policy check karein."}
})();
</script></body></html>
