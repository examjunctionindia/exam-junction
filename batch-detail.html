<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b55"><title>Batch | EXAM JUNCTION</title><link rel="stylesheet" href="assets/css/style.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17243a;font-family:Arial,sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;padding-bottom:35px}header{padding:16px;background:white;border-bottom:1px solid #e6ebf2;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;color:#173b73;text-decoration:none}.back{padding:10px 12px;border:1px solid #e6ebf2;border-radius:10px;background:white}main{padding:20px 16px}h1,h2,h3{color:#10274c}.muted{color:#718096;line-height:1.65;font-size:14px}.panel,.chapter,.notice{background:white;border:1px solid #e6ebf2;border-radius:15px;padding:16px;margin:14px 0}.btn{display:inline-block;border:0;border-radius:10px;padding:12px 15px;background:#173b73;color:white;font-weight:bold;text-decoration:none;cursor:pointer}.lecture,.note{padding:12px 0;border-top:1px solid #edf0f5}.viewer{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#101b35}.pdf{width:100%;height:70vh;border:0;background:#eee}.lesson{background:#f4faf9;border:1px solid #dbeeea;border-radius:14px;padding:14px;margin:12px 0}.lesson-title{font-size:17px;margin:4px 0 10px}.lecture-accordion{padding:0;overflow:hidden}.lecture-accordion>summary{list-style:none;cursor:pointer;padding:14px;margin:0;font-weight:800;display:flex;justify-content:space-between;gap:10px}.lecture-accordion>summary::-webkit-details-marker{display:none}.lecture-accordion>summary:after{content:"＋";color:#376bc0}.lecture-accordion[open]>summary:after{content:"−"}.lecture-content{padding:0 14px 14px}.chapter{padding:0;overflow:hidden}.chapter summary{cursor:pointer;list-style:none;padding:16px;font-weight:800;color:#10274c;display:flex;align-items:center;justify-content:space-between;gap:12px}.chapter summary::-webkit-details-marker{display:none}.chapter summary:after{content:"＋";font-size:20px;color:#376bc0}.chapter[open] summary:after{content:"−"}.chapter .chapter-inner{padding:0 16px 16px}.chapter h2{margin-top:0}.chapter-notes{background:#f8fbff;border-radius:12px;padding:12px;margin-top:12px}.pdf-fullscreen:fullscreen .pdf{height:calc(100vh - 65px)}.media-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.media-actions button{border:0;border-radius:10px;padding:11px 14px;background:#173b73;color:white;font-weight:700}.media-actions a{display:inline-block}.media-fullscreen:fullscreen{background:#050b16;padding:10px;display:flex;flex-direction:column;justify-content:center}.media-fullscreen:fullscreen .viewer{height:calc(100vh - 55px);aspect-ratio:auto}.pdf-fullscreen:fullscreen{background:#101b35;padding:8px}.pdf-fullscreen:fullscreen .pdf{height:calc(100vh - 65px)}.hidden{display:none!important}
</style></head><body><div class="app"><header><a class="brand" href="index.html">← EXAM JUNCTION</a><a href="login.html">Login</a></header><main><div id="status" class="notice">Batch load ho raha hai…</div><section id="content" class="hidden"><div class="panel"><h1 id="title"></h1><p id="description" class="muted"></p><div id="meta" class="muted"></div></div><div id="access-panel" class="panel hidden"></div><div id="chapters"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),status=$("status"),content=$("content"),clientReady=await window.EXAM_JUNCTION.init();if(!clientReady){status.textContent="Connection unavailable. Internet check karke refresh karein.";return}const db=window.EXAM_JUNCTION.supabase,escape=window.EXAM_JUNCTION.escapeHTML,id=new URLSearchParams(location.search).get("id");if(!id){status.textContent="Batch ID nahi mila. Home se batch open karein.";return}
function makeNoteRow(note){const row=document.createElement("div");row.className="note";row.dataset.noteId=note.id;const h=document.createElement("h3");h.textContent=note.title||"Notes";row.append(h);let url=(note.storage_path||"").trim(),openUrl=url;try{const u=new URL(url);if(u.hostname==="drive.google.com"){const m=u.pathname.match(/\/file\/d\/([^/]+)/);if(m){url="https://drive.google.com/file/d/"+m[1]+"/preview";openUrl="https://drive.google.com/file/d/"+m[1]+"/view"}}else if(u.hostname==="docs.google.com"){openUrl=u.origin+u.pathname.replace(/\/edit.*$/,"/edit");url="https://docs.google.com"+u.pathname.replace(/\/edit.*$/,"/preview")}}catch(_){url="";openUrl=""}if(url){const wrap=document.createElement("div");wrap.className="pdf-fullscreen";const actions=document.createElement("div");actions.className="media-actions";const full=document.createElement("button");full.textContent="⛶ PDF Full screen";full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await wrap.requestFullscreen()}catch(_){alert("Full screen supported nahi hai.")}};actions.append(full);const open=document.createElement("a");open.className="btn";open.href=openUrl||url;open.target="_blank";open.rel="noopener noreferrer";open.textContent="↗ Open PDF separately";actions.append(open);wrap.append(actions);const frame=document.createElement("iframe");frame.className="pdf";frame.src=url;frame.title=note.title||"Notes";frame.loading="lazy";frame.setAttribute("allow","fullscreen");wrap.append(frame);row.append(wrap)}else{const p=document.createElement("p");p.className="muted";p.textContent="Google Drive link ya sharing settings check karein.";row.append(p)}return row}
try{const [{data:batch,error:be},{data:userData}]=await Promise.all([db.from("batches").select("id,title,description,platform_name,access_type,is_published").eq("id",id).eq("is_published",true).maybeSingle(),db.auth.getUser()]);if(be)throw be;if(!batch){status.textContent="Batch nahi mila ya abhi publish nahi hai.";return}
$("title").textContent=batch.title||"Maths Batch";$("description").textContent=batch.description||"Batch ke chapters aur learning content."; $("meta").textContent=(batch.platform_name?"Teacher: "+batch.platform_name+" • ":"")+(batch.access_type==="free"?"Free batch":"Selected students only");content.classList.remove("hidden");status.classList.add("hidden");
let allowed=batch.access_type==="free",user=userData?.user||null;
if(batch.access_type==="restricted"&&user){const {data:grant,error}=await db.from("batch_access").select("id").eq("batch_id",id).eq("student_id",user.id).maybeSingle();if(error)console.warn(error);allowed=!!grant}
if(!allowed){const panel=$("access-panel");panel.classList.remove("hidden");panel.innerHTML='<h2>🔒 Access required</h2><p class="muted">'+(user?'Is batch ke liye access request bhejein. Admin approve karega.':'Restricted batch ke liye login karke request bhejna zaroori hai.')+'</p><button class="btn" id="request">'+(user?'Request Access':'Login to Continue')+'</button>'; $("request").onclick=async()=>{if(!user){location.href="login.html?next="+encodeURIComponent("batch-detail.html?id="+id);return}const {data:existing,error:ee}=await db.from("batch_join_requests").select("id,status").eq("batch_id",id).eq("student_id",user.id).maybeSingle();if(ee){alert("Request status check nahi ho saka.");return}if(existing){alert("Aapki request status: "+existing.status);return}const {error}=await db.from("batch_join_requests").insert({batch_id:id,student_id:user.id,status:"pending"});if(error){alert("Request nahi bhej paaye: "+error.message);return}alert("Request bhej di gayi. Admin approval ka wait karein.");$("request").textContent="Request sent";$("request").disabled=true};return}
const ch=$("chapters");const {data:chapters,error:ce}=await db.from("chapters").select("id,title,position").eq("batch_id",id).order("position",{ascending:true});if(ce)throw ce;if(!chapters?.length){ch.innerHTML='<div class="notice">Abhi chapters add nahi hue hain.</div>';return}
for(let chapterIndex=0;chapterIndex<chapters.length;chapterIndex++){const chapter=chapters[chapterIndex];const section=document.createElement("details");section.className="chapter";section.open=chapterIndex===0;const heading=document.createElement("summary");heading.textContent=chapter.title||"Chapter";section.append(heading);const inner=document.createElement("div");inner.className="chapter-inner";section.append(inner);const [lr,nr]=await Promise.all([db.from("lectures").select("id,title,youtube_url,position,teacher_name,download_url,download_allowed,download_scope").eq("chapter_id",chapter.id).order("position",{ascending:true}),db.from("chapter_notes").select("id,title,storage_path,created_at,lecture_id").eq("chapter_id",chapter.id).order("created_at",{ascending:false})]);if(lr.error)throw lr.error;if(nr.error)throw nr.error;heading.textContent=(chapter.title||"Chapter")+" ("+(lr.data||[]).length+" lectures)";
if(!(lr.data||[]).length){const emptyLecture=document.createElement("p");emptyLecture.className="muted";emptyLecture.textContent="Is chapter mein abhi lectures add nahi kiye gaye hain.";inner.append(emptyLecture)}
for(const lecture of (lr.data||[])){const row=document.createElement("details");row.className="lecture lesson lecture-accordion";const h=document.createElement("summary");h.className="lesson-title";h.textContent=lecture.title||"Lecture";row.append(h);const lectureBody=document.createElement("div");lectureBody.className="lecture-content";row.append(lectureBody);const videoId=(lecture.youtube_url||"").match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);if(videoId){const wrap=document.createElement("div");wrap.className="media-fullscreen";const frame=document.createElement("iframe");frame.className="viewer";frame.src="https://www.youtube-nocookie.com/embed/"+videoId[1]+"?controls=1&playsinline=1&rel=0";frame.title=lecture.title||"Lecture";frame.loading="lazy";frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";frame.allowFullscreen=true;wrap.append(frame);lectureBody.append(wrap);const actions=document.createElement("div");actions.className="media-actions";const full=document.createElement("button");full.textContent="⛶ Full screen";full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await wrap.requestFullscreen()}catch(_){alert("Full screen is browser/device par supported nahi hai.")}};actions.append(full);if(lecture.download_allowed&&lecture.download_url){const dl=document.createElement("a");dl.className="btn";dl.href=lecture.download_url;dl.target="_blank";dl.rel="noopener noreferrer";dl.textContent="⬇ Download Lecture";actions.append(dl)}lectureBody.append(actions);if(lecture.teacher_name){const teacher=document.createElement("p");teacher.className="muted";teacher.textContent="Teacher: "+lecture.teacher_name;lectureBody.append(teacher)}const lectureNotes=(nr.data||[]).filter(n=>n.lecture_id===lecture.id);if(lectureNotes.length){const ln=document.createElement("div");ln.className="chapter-notes";const lh=document.createElement("h4");lh.textContent="📄 Lecture Notes";ln.append(lh);for(const n of lectureNotes){const nrw=makeNoteRow(n);ln.append(nrw)}lectureBody.append(ln)}}else{const p=document.createElement("p");p.className="muted";p.textContent="Valid YouTube URL nahi mila.";lectureBody.append(p)}inner.append(row)}
const chapterOnlyNotes=(nr.data||[]).filter(note=>!note.lecture_id);const chapterNotes=document.createElement("div");chapterNotes.className="chapter-notes";const chapterNotesHeading=document.createElement("h3");chapterNotesHeading.textContent="📄 Chapter Notes";chapterNotes.append(chapterNotesHeading);for(const note of chapterOnlyNotes){chapterNotes.append(makeNoteRow(note))}if(chapterOnlyNotes.length===0){const empty=document.createElement("p");empty.className="muted";empty.textContent="Chapter Notes add nahi kiye gaye hain.";chapterNotes.append(empty)}inner.append(chapterNotes);ch.append(section)}
}catch(e){console.error(e);status.textContent="Content load nahi hua. Database connection ya access policy check karein."}
})();
</script></body></html>
