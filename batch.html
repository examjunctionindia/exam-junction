<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b55">
  <title>Batches | EXAM JUNCTION</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7fb;color:#17243a;font-family:Arial,sans-serif}
    a{text-decoration:none;color:inherit}
    .app{max-width:760px;min-height:100vh;margin:auto;padding-bottom:95px}
    header{display:flex;align-items:center;justify-content:space-between;padding:17px;background:white;border-bottom:1px solid #e6ebf2}
    .brand{font-weight:800;color:#173b73;font-size:18px}
    .header-link{padding:10px 13px;border:1px solid #e6ebf2;border-radius:11px;font-size:13px}
    main{padding:22px 17px}
    .eyebrow{color:#376bc0;font-size:11px;font-weight:bold;letter-spacing:1.5px}
    h1{margin:8px 0;color:#10274c;font-size:29px}
    .subtitle{color:#718096;font-size:14px;line-height:1.6}
    .search{width:100%;margin:20px 0 14px;padding:15px;border:1px solid #e0e6ef;border-radius:13px;background:white;font-size:15px}
    .filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
    .filter{padding:9px 14px;border:1px solid #dfe6f0;border-radius:30px;background:white;color:#52627a;font-size:12px;font-weight:bold;cursor:pointer}
    .filter.active{background:#173b73;color:white;border-color:#173b73}
    .batch-list{display:grid;gap:14px}
    .card{overflow:hidden;border:1px solid #e6ebf2;border-radius:17px;background:white}
    .cover{padding:20px;background:linear-gradient(120deg,#eaf1ff,#f4f7ff)}
    .tag{display:inline-block;padding:6px 9px;border-radius:7px;background:#dbe7ff;color:#214f9b;font-size:10px;font-weight:bold}
    .cover h2{margin:13px 0 4px;font-size:20px;color:#10274c}
    .body{padding:17px}
    .description{color:#718096;font-size:13px;line-height:1.7}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #e6ebf2}
    .status{font-size:12px;font-weight:bold;color:#16855d}
    .open{padding:12px 15px;border:0;border-radius:10px;background:#173b73;color:white;font-weight:bold;font-size:12px}
    .empty{padding:32px 20px;text-align:center;background:white;border:1px dashed #cbd6e5;border-radius:16px}
    .empty h2{font-size:17px;color:#10274c}
    .empty p{font-size:13px;line-height:1.7;color:#718096}
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:760px;padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:white;border-top:1px solid #e6ebf2}
    nav a{text-align:center;font-size:10px;font-weight:bold;color:#8793a5;padding:7px 0}
    nav a.active{color:#173b73}
    @media(min-width:600px){.batch-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="index.html">EXAM JUNCTION</a>
    <a class="header-link" href="notifications.html">🔔 Alerts</a>
  </header>

  <main>
    <div class="eyebrow">YOUR PREPARATION</div>
    <h1>Explore Batches</h1>
    <p class="subtitle">Find your course, explore batch details and continue your preparation.</p>

    <input class="search" id="search" type="search" placeholder="Search batches..." aria-label="Search batches">

    <div class="filters" aria-label="Batch filters">
      <button class="filter active" data-filter="all">All Batches</button>
      <button class="filter" data-filter="free">Free</button>
      <button class="filter" data-filter="restricted">Restricted</button>
    </div>

    <section class="batch-list" id="batch-list">
      <div class="empty" style="grid-column:1/-1">
        <h2>Batches will appear here</h2>
        <p>Published batches will appear here when the database and admin panel are connected.</p>
      </div>
    </section>
  </main>

  <nav aria-label="Main navigation">
    <a href="index.html">⌂<br>Home</a>
    <a class="active" href="batch.html">▤<br>Batch</a>
    <a href="books.html">▣<br>Books</a>
    <a href="leaderboard.html">♛<br>Leaderboard</a>
    <a href="about.html">ⓘ<br>About</a>
  </nav>
</div>

<script>
  let selectedFilter = "all";

  document.querySelectorAll(".filter").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".filter").forEach(item =>
        item.classList.remove("active")
      );
      button.classList.add("active");
      selectedFilter = button.dataset.filter;
      filterBatches();
    });
  });

  document.getElementById("search").addEventListener("input", filterBatches);

  function filterBatches() {
    document.querySelectorAll("#batch-list .card").forEach(card => {
      const matchesText = card.textContent.toLowerCase().includes(
        document.getElementById("search").value.toLowerCase()
      );
      const matchesType = selectedFilter === "all" ||
        card.dataset.type === selectedFilter;
      card.hidden = !(matchesText && matchesType);
    });
  }
</script>
</body>
</html>
